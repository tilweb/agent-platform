services:
  backend:
    build: ./backend
    volumes:
      - ./data:/data                # Shared data (../data from backend cwd)
      - ./backend/data:/app/data    # Backend-specific data (audit, apps)
    env_file:
      - path: ./.env
        required: true
      - path: ./docker-compose.env
        required: false
    environment:
      - TRUST_PROXY=true
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
