services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data    # Persistent data (plugins, config, chats, etc.)
    env_file:
      - path: ./.env
        required: true
      - path: ./docker-compose.env
        required: false
    environment:
      - TRUST_PROXY=true
      - MCP_RUNNER_URL=http://mcp-runner:3002
      - MCP_RUNNER_SECRET=${MCP_RUNNER_SECRET:?Set MCP_RUNNER_SECRET in .env}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mcp-runner:
        condition: service_healthy

  mcp-runner:
    build: ./mcp-runner
    restart: unless-stopped
    environment:
      - MCP_RUNNER_SECRET=${MCP_RUNNER_SECRET:?Set MCP_RUNNER_SECRET in .env}
      - MCP_RUNNER_PORT=3002
    volumes:
      - ./mcp-runner/data/npm-cache:/mcp-packages      # Persistent package store shared across restarts
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
