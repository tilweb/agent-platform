title: Funktionen des Supervisor-Agents
summary: Der User fragt nach den Fähigkeiten des Supervisor-Agents, der Aufgaben an spezialisierte Agenten delegiert, wie Wissens-, Schreib- und Recherche-Agenten.
createdAt: 2026-02-11T21:13:48.480Z
updatedAt: 2026-02-11T21:13:54.305Z
messages:
  - role: user
    content: Was kannst du alles?
  - role: assistant
    content: |-
      Ich bin der Supervisor-Agent der Agent Platform und koordiniere alle Aufgaben. Hier ist, was ich kann:

      1. **Allgemeine Unterstützung**: Ich helfe bei allgemeinen Fragen, Konversationen und kleinen Aufgaben.
      2. **Agenten-Orchestrierung**: Ich delegiere Aufgaben an spezialisierte Agenten, je nach Anfrage:
         - **Knowledge-Agent**: Für Fragen zur Wissensdatenbank und Dokumenten
         - **Writer-Agent**: Für Texte, E-Mails und Berichte
         - **Researcher-Agent**: Für Web-Recherchen und Informationsbeschaffung
         - **Planner-Agent**: Für komplexe Recherche-Pläne
         - **Connections-Agent**: Für Zugriff auf externe Dienste wie Google Drive oder Confluence
         - **General-Agent**: Für allgemeine Datei- und Systemaufgaben
         - **Chat-Dokument-Reader**: Für hochgeladene Dokumente
         - **Vision-Analyst**: Für Bilder und Screenshot-Analysen
      3. **Kontextverwaltung**: Ich speichere relevante Informationen über dich (z. B. Termine, Projekte, Firma) in deinem Benutzerprofil.
      4. **Hintergrund-Tasks**: Ich erstelle automatisch Hintergrund-Aufgaben für umfangreiche oder langwierige Arbeiten.
      5. **Direkte Antworten**: Bei einfachen Fragen oder wenn Kontext-Dokumente geladen sind, antworte ich direkt.

      Wenn du eine Aufgabe hast, sag mir einfach, was du brauchst – ich kümmere mich um den Rest!
