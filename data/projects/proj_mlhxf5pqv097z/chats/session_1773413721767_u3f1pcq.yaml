title: Erstellung eines Arbeitsvertrags für Marc Richter
summary: Der Benutzer möchte einen Arbeitsvertrag für Marc Richter erstellen. Der Assistent bittet um weitere Details wie Stellenbezeichnung, Arbeitszeit, Gehalt und Vertragsart, um den Vertrag korrekt zu gestalten.
