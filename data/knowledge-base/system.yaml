# Knowledge Base - Systemkonfiguration
version: "1.0"
name: "Agent Platform Knowledge Base"

# Routing-Konfiguration
routing:
  max_collections_per_query: 3
  max_documents_per_collection: 5
  confidence_threshold: 0.6

# Reader-Konfiguration
reader:
  max_content_length: 50000
  use_index_threshold_chars: 20000

# Indexer-Konfiguration
indexer:
  supported_formats:
    - pdf
    - docx
    - doc
    - xlsx
    - pptx
    - txt
    - md
    - html
  markitdown_api:
    url: "https://api.adapi.adacor.ai/v1/documentMarkdown/"
    method: "PUT"
    content_type: "multipart/form-data"

# Synthese-Konfiguration
synthesis:
  max_sources: 10
  include_confidence: true
  include_sources: true
  language: "de"
