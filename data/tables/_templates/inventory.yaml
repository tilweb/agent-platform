id: inventory
name: Inventar / Asset-Verwaltung
description: Vorlage für die Verwaltung von IT-Assets, Lizenzen und Wartungen
icon: "\U0001F4E6"

tables:
  - id: assets
    name: Assets
    description: Hardware und Geräte
    icon: "\U0001F4BB"
    columns:
      - id: name
        name: Name
        type: text
        required: true
      - id: kategorie
        name: Kategorie
        type: select
        options:
          - Laptop
          - Desktop
          - Monitor
          - Server
          - Netzwerk
          - Drucker
          - Mobilgerät
          - Zubehör
          - Sonstiges
        required: true
      - id: hersteller
        name: Hersteller
        type: text
      - id: modell
        name: Modell
        type: text
      - id: seriennummer
        name: Seriennummer
        type: text
      - id: inventarnummer
        name: Inventarnummer
        type: text
      - id: status
        name: Status
        type: select
        options:
          - in_betrieb
          - lager
          - defekt
          - in_reparatur
          - ausgemustert
        default: in_betrieb
      - id: standort
        name: Standort
        type: text
      - id: zugewiesen_an
        name: Zugewiesen an
        type: text
      - id: kaufdatum
        name: Kaufdatum
        type: date
      - id: kaufpreis
        name: Kaufpreis
        type: number
        min: 0
        decimals: 2
      - id: garantie_bis
        name: Garantie bis
        type: date
      - id: notizen
        name: Notizen
        type: text_long
      - id: tags
        name: Tags
        type: tags
    settings:
      primary_column: name
      default_sort: name
      row_color_by: status
      row_colors:
        in_betrieb: "#dcfce7"
        lager: "#dbeafe"
        defekt: "#fee2e2"
        in_reparatur: "#fef3c7"
        ausgemustert: "#f3f4f6"
    views:
      - id: in-betrieb
        name: In Betrieb
        filter: "status = 'in_betrieb'"
        sort: name ASC
      - id: garantie-abgelaufen
        name: Garantie abgelaufen
        description: Assets deren Garantie abgelaufen ist
      - id: zum-ausmustern
        name: Zum Ausmustern
        filter: "status = 'defekt' OR status = 'ausgemustert'"

  - id: lizenzen
    name: Lizenzen
    description: Software-Lizenzen und Abonnements
    icon: "\U0001F511"
    columns:
      - id: name
        name: Software
        type: text
        required: true
      - id: hersteller
        name: Hersteller
        type: text
      - id: lizenztyp
        name: Lizenztyp
        type: select
        options:
          - Einzelplatz
          - Volumen
          - Subscription
          - Open Source
          - Freeware
          - Enterprise
        required: true
      - id: lizenzschluessel
        name: Lizenzschlüssel
        type: text
      - id: seats
        name: Anzahl Seats
        type: number
        min: 0
      - id: genutzte_seats
        name: Genutzte Seats
        type: number
        min: 0
      - id: ablaufdatum
        name: Ablaufdatum
        type: date
      - id: kosten_jaehrlich
        name: Jährliche Kosten
        type: number
        min: 0
        decimals: 2
      - id: vertragspartner
        name: Vertragspartner
        type: text
      - id: automatische_verlaengerung
        name: Auto-Verlängerung
        type: boolean
        default: false
      - id: kuendigungsfrist
        name: Kündigungsfrist
        type: text
      - id: notizen
        name: Notizen
        type: text_long
    settings:
      primary_column: name
      default_sort: ablaufdatum
    views:
      - id: bald-ablaufend
        name: Bald ablaufend
        description: Lizenzen die in den nächsten 90 Tagen ablaufen
        sort: ablaufdatum ASC
      - id: subscriptions
        name: Abonnements
        filter: "lizenztyp = 'Subscription'"

  - id: wartungen
    name: Wartungen
    description: Wartungshistorie und geplante Wartungen
    icon: "\U0001F527"
    columns:
      - id: asset
        name: Asset
        type: relation
        relation_table: assets
        relation_display_column: name
        required: true
      - id: typ
        name: Wartungstyp
        type: select
        options:
          - Inspektion
          - Reinigung
          - Reparatur
          - Update
          - Austausch
          - Sonstiges
        required: true
      - id: datum
        name: Datum
        type: date
        required: true
      - id: durchgefuehrt_von
        name: Durchgeführt von
        type: text
      - id: beschreibung
        name: Beschreibung
        type: text_long
      - id: kosten
        name: Kosten
        type: number
        min: 0
        decimals: 2
      - id: naechste_wartung
        name: Nächste Wartung
        type: date
      - id: status
        name: Status
        type: select
        options:
          - geplant
          - durchgefuehrt
          - abgebrochen
        default: durchgefuehrt
    settings:
      primary_column: typ
      default_sort: datum
      default_sort_direction: DESC
    views:
      - id: geplant
        name: Geplante Wartungen
        filter: "status = 'geplant'"
        sort: datum ASC
