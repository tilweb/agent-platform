id: crm
name: CRM / Kundenmanagement
description: Vorlage für Kundenbeziehungsmanagement mit Kontakten, Firmen und Interaktionen
icon: "\U0001F4BC"

tables:
  - id: firmen
    name: Firmen
    description: Unternehmen und Organisationen
    icon: "\U0001F3E2"
    columns:
      - id: name
        name: Name
        type: text
        required: true
      - id: branche
        name: Branche
        type: select
        options:
          - Technologie
          - Finanzen
          - Gesundheit
          - Einzelhandel
          - Produktion
          - Beratung
          - Sonstiges
      - id: website
        name: Website
        type: url
      - id: groesse
        name: Unternehmensgröße
        type: select
        options:
          - 1-10
          - 11-50
          - 51-200
          - 201-1000
          - 1000+
      - id: adresse
        name: Adresse
        type: text_long
      - id: notizen
        name: Notizen
        type: text_long
    settings:
      primary_column: name
      default_sort: name

  - id: kontakte
    name: Kontakte
    description: Persönliche und geschäftliche Kontakte
    icon: "\U0001F465"
    columns:
      - id: name
        name: Name
        type: text
        required: true
      - id: email
        name: E-Mail
        type: email
      - id: telefon
        name: Telefon
        type: text
      - id: firma
        name: Firma
        type: relation
        relation_table: firmen
        relation_display_column: name
      - id: position
        name: Position
        type: text
      - id: status
        name: Status
        type: select
        options:
          - lead
          - interessent
          - kunde
          - partner
          - inaktiv
        default: lead
      - id: tags
        name: Tags
        type: tags
      - id: letzte_interaktion
        name: Letzte Interaktion
        type: date
      - id: notizen
        name: Notizen
        type: text_long
    settings:
      primary_column: name
      default_sort: name
      row_color_by: status
      row_colors:
        lead: "#fef3c7"
        interessent: "#dbeafe"
        kunde: "#dcfce7"
        partner: "#e0e7ff"
        inaktiv: "#f3f4f6"
    views:
      - id: aktive
        name: Aktive Kontakte
        filter: "status = 'kunde' OR status = 'partner'"
        sort: name ASC
      - id: leads
        name: Neue Leads
        filter: "status = 'lead'"
        sort: letzte_interaktion DESC
      - id: follow-up
        name: Follow-up nötig
        description: Kontakte ohne Interaktion in den letzten 30 Tagen

  - id: interaktionen
    name: Interaktionen
    description: Aktivitäten und Kommunikation mit Kontakten
    icon: "\U0001F4AC"
    columns:
      - id: kontakt
        name: Kontakt
        type: relation
        relation_table: kontakte
        relation_display_column: name
        required: true
      - id: typ
        name: Typ
        type: select
        options:
          - Anruf
          - E-Mail
          - Meeting
          - Nachricht
          - Notiz
        required: true
      - id: datum
        name: Datum
        type: datetime
        required: true
      - id: betreff
        name: Betreff
        type: text
      - id: inhalt
        name: Inhalt
        type: text_long
      - id: naechste_aktion
        name: Nächste Aktion
        type: text
      - id: erledigt
        name: Erledigt
        type: boolean
        default: false
    settings:
      primary_column: betreff
      default_sort: datum
      default_sort_direction: DESC
