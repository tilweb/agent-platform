id: "lizenzen"
name: "Lizenzen"
description: "Software-Lizenzen und Abonnements"
icon: "🔑"
columns:
  - id: "name"
    name: "Software"
    type: "text"
    required: true
  - id: "hersteller"
    name: "Hersteller"
    type: "text"
  - id: "lizenztyp"
    name: "Lizenztyp"
    type: "select"
    options:
      - "Einzelplatz"
      - "Volumen"
      - "Subscription"
      - "Open Source"
      - "Freeware"
      - "Enterprise"
    required: true
  - id: "lizenzschluessel"
    name: "Lizenzschlüssel"
    type: "text"
  - id: "seats"
    name: "Anzahl Seats"
    type: "number"
    min: 0
  - id: "genutzte_seats"
    name: "Genutzte Seats"
    type: "number"
    min: 0
  - id: "ablaufdatum"
    name: "Ablaufdatum"
    type: "date"
  - id: "kosten_jaehrlich"
    name: "Jährliche Kosten"
    type: "number"
    min: 0
    decimals: 2
  - id: "vertragspartner"
    name: "Vertragspartner"
    type: "text"
  - id: "automatische_verlaengerung"
    name: "Auto-Verlängerung"
    type: "boolean"
    default: false
  - id: "kuendigungsfrist"
    name: "Kündigungsfrist"
    type: "text"
  - id: "notizen"
    name: "Notizen"
    type: "text_long"
settings:
  primary_column: "name"
  default_sort: "ablaufdatum"
views:
  - id: "bald-ablaufend"
    name: "Bald ablaufend"
    description: "Lizenzen die in den nächsten 90 Tagen ablaufen"
    sort: "ablaufdatum ASC"
  - id: "subscriptions"
    name: "Abonnements"
    filter: "lizenztyp = 'Subscription'"
created_at: "2026-02-08T10:38:05.112Z"
updated_at: "2026-02-08T10:38:05.112Z"
