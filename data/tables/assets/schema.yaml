id: "assets"
name: "Assets"
description: "Hardware und Geräte"
icon: "💻"
columns:
  - id: "name"
    name: "Name"
    type: "text"
    required: true
  - id: "kategorie"
    name: "Kategorie"
    type: "select"
    options:
      - "Laptop"
      - "Desktop"
      - "Monitor"
      - "Server"
      - "Netzwerk"
      - "Drucker"
      - "Mobilgerät"
      - "Zubehör"
      - "Sonstiges"
    required: true
  - id: "hersteller"
    name: "Hersteller"
    type: "text"
  - id: "modell"
    name: "Modell"
    type: "text"
  - id: "seriennummer"
    name: "Seriennummer"
    type: "text"
  - id: "inventarnummer"
    name: "Inventarnummer"
    type: "text"
  - id: "status"
    name: "Status"
    type: "select"
    options:
      - "in_betrieb"
      - "lager"
      - "defekt"
      - "in_reparatur"
      - "ausgemustert"
    default: "in_betrieb"
  - id: "standort"
    name: "Standort"
    type: "text"
  - id: "zugewiesen_an"
    name: "Zugewiesen an"
    type: "text"
  - id: "kaufdatum"
    name: "Kaufdatum"
    type: "date"
  - id: "kaufpreis"
    name: "Kaufpreis"
    type: "number"
    min: 0
    decimals: 2
  - id: "garantie_bis"
    name: "Garantie bis"
    type: "date"
  - id: "notizen"
    name: "Notizen"
    type: "text_long"
  - id: "tags"
    name: "Tags"
    type: "tags"
settings:
  primary_column: "name"
  default_sort: "name"
  row_color_by: "status"
  row_colors:
    in_betrieb: "#dcfce7"
    lager: "#dbeafe"
    defekt: "#fee2e2"
    in_reparatur: "#fef3c7"
    ausgemustert: "#f3f4f6"
views:
  - id: "in-betrieb"
    name: "In Betrieb"
    filter: "status = 'in_betrieb'"
    sort: "name ASC"
  - id: "garantie-abgelaufen"
    name: "Garantie abgelaufen"
    description: "Assets deren Garantie abgelaufen ist"
  - id: "zum-ausmustern"
    name: "Zum Ausmustern"
    filter: "status = 'defekt' OR status = 'ausgemustert'"
created_at: "2026-02-08T10:38:05.103Z"
updated_at: "2026-02-08T10:38:05.104Z"
