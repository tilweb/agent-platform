id: "wartungen"
name: "Wartungen"
description: "Wartungshistorie und geplante Wartungen"
icon: "🔧"
columns:
  - id: "asset"
    name: "Asset"
    type: "relation"
    relation_table: "assets"
    relation_display_column: "name"
    required: true
  - id: "typ"
    name: "Wartungstyp"
    type: "select"
    options:
      - "Inspektion"
      - "Reinigung"
      - "Reparatur"
      - "Update"
      - "Austausch"
      - "Sonstiges"
    required: true
  - id: "datum"
    name: "Datum"
    type: "date"
    required: true
  - id: "durchgefuehrt_von"
    name: "Durchgeführt von"
    type: "text"
  - id: "beschreibung"
    name: "Beschreibung"
    type: "text_long"
  - id: "kosten"
    name: "Kosten"
    type: "number"
    min: 0
    decimals: 2
  - id: "naechste_wartung"
    name: "Nächste Wartung"
    type: "date"
  - id: "status"
    name: "Status"
    type: "select"
    options:
      - "geplant"
      - "durchgefuehrt"
      - "abgebrochen"
    default: "durchgefuehrt"
settings:
  primary_column: "typ"
  default_sort: "datum"
  default_sort_direction: "DESC"
views:
  - id: "geplant"
    name: "Geplante Wartungen"
    filter: "status = 'geplant'"
    sort: "datum ASC"
created_at: "2026-02-08T10:38:05.115Z"
updated_at: "2026-02-08T10:38:05.116Z"
