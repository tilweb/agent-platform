description: |-
  Erstelle einen detaillierten Social Media Plan für LinkedIn zur Bewerbung des KI Workplace. Der Plan soll bis zum 18.02. für die W3 Fair in Wetzlar fertig sein. Der Plan sollte folgende Elemente enthalten:

  1. Zielsetzung: Was soll mit den LinkedIn-Posts erreicht werden?
  2. Zielgruppe: Wer soll angesprochen werden?
  3. Content-Strategie: Welche Inhalte sollen gepostet werden?
  4. Posting-Plan: Wann und wie oft sollen Posts veröffentlicht werden?
  5. Engagement-Strategie: Wie soll auf Interaktionen reagiert werden?
  6. Erfolgsmessung: Welche KPIs sollen verwendet werden, um den Erfolg zu messen?
  7. Visuelle Gestaltung: Welche visuellen Elemente sollen verwendet werden?
  8. Hashtag-Strategie: Welche Hashtags sollen verwendet werden?

  Der Plan sollte spezifisch und umsetzbar sein und auf die W3 Fair in Wetzlar abgestimmt sein.
