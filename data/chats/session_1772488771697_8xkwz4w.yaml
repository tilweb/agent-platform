title: "Familiäre Krisen im Beruf: Unterstützung für Manager"
summary: "Herr Müller, ein Senior Manager, steht vor einer psychischen Krise seines Kindes und überlegt berufliche Entlastungsmöglichkeiten wie Sabbatical oder Stundendegression."
