messages:
  - role: user
    content: "was sage ich da?"
  - role: assistant
    content: "Ich verstehe, dass du fragst, was du sagen sollst. Könntest du bitte präzisieren, in welchem Kontext du eine Aussage machen möchtest? Zum Beispiel:\n\n- Sollst du etwas zu deinem Projekt \"KI Workplace\" sagen?\n- Geht es um die W3 Fair am 18.02.2026?\n- Oder hast du eine spezifische Situation im Sinn, in der du eine Aussage machen möchtest?\n\nJe nach Kontext kann ich dir helfen, eine passende Formulierung zu finden."
  - role: user
    content: "in der Audio Datei?"
  - role: assistant
    content: "Ich verstehe, dass du fragst, was du in der Audio-Datei sagen sollst. Leider kann ich keine Audio-Dateien hören oder analysieren, da ich nur Textverarbeitung und -analyse unterstützen kann. \n\nWenn du mir den Inhalt der Audio-Datei beschreibst oder mir sagst, worum es in der Aufnahme geht, kann ich dir helfen, eine passende Antwort oder Aussage zu formulieren. Zum Beispiel:\n\n- Geht es um eine Präsentation?\n- Ist es ein Gespräch oder eine Aufnahme für einen bestimmten Zweck?\n- Welche Informationen sollen vermittelt werden?\n\nBitte gib mir mehr Details, damit ich dir besser helfen kann."
  - role: user
    content: "Anhang: recording-1770996092146.webm"
  - role: assistant
    content: "Ich kann leider keine Audio-Dateien direkt verarbeiten oder analysieren, da ich nur Textverarbeitung und -analyse unterstützen kann. Wenn du mir den Inhalt der Aufnahme beschreibst oder mir sagst, worum es in der Audio-Datei geht, kann ich dir helfen, eine passende Antwort oder Aussage zu formulieren.\n\nZum Beispiel:\n- Geht es um eine Präsentation?\n- Ist es ein Gespräch oder eine Aufnahme für einen bestimmten Zweck?\n- Welche Informationen sollen vermittelt werden?\n\nBitte gib mir mehr Details, damit ich dir besser helfen kann."
