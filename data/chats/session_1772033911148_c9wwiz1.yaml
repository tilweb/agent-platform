    content: "Welche Collections stehen zur Verfügung?"
  - role: assistant
    content: "Hier sind die verfügbaren Collections in der Wissensdatenbank:\n\n1. **Compliance und Richtlinien**  \n   - Beschreibung: Richtlinien, Vorgaben und Compliance Konzepte  \n   - Dokumentanzahl: 8  \n   - Aktivierungsbedingungen: Compliance-Fragen, Richtlinien-Fragen, Informationssicherheits-Vorgaben, Compliance-Vorgaben  \n\n2. **C5 Workshops**  \n   - Beschreibung: Protokolle und Ergebnisse der C5 Workshops  \n   - Dokumentanzahl: 3  \n   - Aktivierungsbedingungen: C5-Workshop, C5, Workshop  \n\n3. **Zukunftstag 2026**  \n   - Beschreibung: Alle Materialien und Planungen für unseren Messestand und Masterclass zu unserem Produkt KI-Workplace beim BVMW  \n   - Dokumentanzahl: 0  \n   - Aktivierungsbedingungen: Messe, Messe-Planung, Zukunftstag 2026  \n\n4. **IKS (internes dienstleistungsbezogenes Kontrollsystem)**  \n   - Beschreibung: Beschreibung und Dokumentation des IKS – dienstleistungsbezogenen Kontrollsystems der Adacor  \n   - Dokumentanzahl: 1  \n   - Aktivierungsbedingungen: Kontrollsystem, IKS, Kontrollen, Maßnahmen, PS 951, ISAE 3401, Informationssicherheit, SOC2, Incident Management, Problem Management, Capacity Management, Risikomanagement  \n\nWenn du nach Informationen aus einer bestimmten Collection suchst, lass es mich wissen – ich kann dir dabei helfen, die relevanten Dokumente zu finden."
