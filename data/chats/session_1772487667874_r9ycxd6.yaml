title: Berufliche Belastung bei familiärer Krisensituation
summary: "Herr Müller, Senior Manager, steht vor der Herausforderung, beruflich präsent zu bleiben, während seine Familie eine psychische Krise durchlebt. Er erwägt Sabbatical, Stundenumstellung oder Delegation von Aufgaben."
