    content: transkribieren bitte
  - role: assistant
    content: "Ich verstehe, dass du eine Transkription möchtest. Da du jedoch keine spezifische Datei oder Audioquelle angegeben hast, kann ich keine Transkription erstellen.\n\nBitte gib an, welches Audio oder Video du transkribiert haben möchtest. Wenn du eine Datei hochgeladen hast, teile mir bitte mit, um welches Medium es sich handelt (z.B. \"recording-1770994815923.webm\") und was du genau von der Transkription erwartest.\n\nFalls du eine Transkription eines bestimmten Themas oder einer bestimmten Person möchtest, beschreibe bitte den Inhalt oder die Situation, damit ich dir weiterhelfen kann."
