    content: "Ich habe die nächsten Spiele von Eintracht Frankfurt für die Saison 2025/2026 recherchiert. Hier sind die wichtigsten Termine:\n\n### Champions League 2025/2026\n- **1. Spieltag**: 18. September 2025, 21:00 Uhr – Eintracht Frankfurt vs. Eintracht Frankfurt (Gegner: SGE)  \n- **Nächstes Heimspiel**: 28. Januar 2026, 21:00 Uhr – Eintracht Frankfurt vs. Tottenham Hotspur (Deutsche Bank Park)\n\n### Bundesliga 2025/2026\nDie genauen Termine für die Bundesliga-Spiele sind auf der offiziellen Website von Eintracht Frankfurt verfügbar. Der aktuelle Spielplan umfasst alle Spiele der Saison 2025/2026, einschließlich DFB-Pokal und Champions League.\n\n### Quellen\n1. [Eintracht Frankfurt – Spielplan 2025/2026 – Fussballdaten](https://www.fussballdaten.de/vereine/eintracht-frankfurt/spielplan/)\n2. [Spielplan 2025/2026 – Alle Spiele – Profis – Eintracht Frankfurt Männer](https://profis.eintracht.de/spielplan/)\n3. [Eintracht Frankfurt | Spielplan 2025/2026 – Spiegel Sport](https://sportdaten.spiegel.de/verein/te530/eintracht-frankfurt/spielplan/)\n4. [Bundesliga-Fußball mit Eintracht Frankfurt | Stadt Frankfurt am Main](https://frankfurt.de/themen/sport/sportevents/bundesligasport-in-frankfurter-stadien)"
