messages:
  - role: user
    content: Zeige mir die verfügbaren Dateien
  - role: assistant
    content: "Die Wissensdatenbank enthält aktuell eine Collection mit dem Namen \"Compliance und Richtlinien\". Diese Collection umfasst 3 Dokumente zu den Themen Richtlinien, Vorgaben und Compliance Konzepte.\n\nFalls du spezifische Fragen zu Compliance oder Richtlinien hast, helfe ich dir gerne weiter!"
  - role: user
    content: "Welche Security Incidents gab es im November 2025?"
  - role: assistant
    content: "Im November 2025 wurden keine Security Incidents gemeldet. Dies wird im Abschnitt \"Sicherheitsvorfälle\" des Dokuments zur Managementbewertung des Informationssicherheitsmanagementsystems (ISM) für November 2025 explizit bestätigt."
  - role: user
    content: "Wieviele Security Incidents gab es in der zweiten Jahreshälfte 2025?"
  - role: assistant
    content: In der zweiten Jahreshälfte 2025 wurden keine Sicherheitsvorfälle vom Typ Incident oder Problem mit der Priorität Blocker oder Critical gemeldet. Dies wird sowohl für den November 2025 als auch für den Dezember 2025 in den jeweiligen Managementbewertungen des Informationssicherheitsmanagementsystems (ISM) bestätigt.
