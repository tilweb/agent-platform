  - role: user
    content: "Welche Collections haben wir?"
  - role: assistant
    content: "Hier sind die verfügbaren Collections in der Wissensdatenbank:\n\n1. **Compliance und Richtlinien**  \n   - Enthält Richtlinien, Vorgaben und Compliance-Konzepte  \n   - 8 Dokumente vorhanden  \n   - Relevant für Fragen zu Compliance, Sicherheitsvorgaben, Richtlinien  \n\n2. **C5 Workshops**  \n   - Beinhaltet Protokolle und Ergebnisse der C5 Workshops  \n   - 3 Dokumente vorhanden  \n   - Relevant für C5-Workshop-Themen  \n\n3. **Zukunftstag 2026**  \n   - Enthält Materialien und Planungen für den Zukunftstag 2026  \n   - Aktuell 0 Dokumente vorhanden  \n   - Relevant für Messe- und Veranstaltungsplanung  \n\n4. **IKS (internes dienstleistungsbezogenes Kontrollsystem)**  \n   - Beschreibt das IKS der Adacor  \n   - 1 Dokument vorhanden  \n   - Relevant für Kontrollsysteme, Sicherheit, Incident- und Risikomanagement  \n\nWenn du nach spezifischen Informationen suchst, kann ich dir gerne helfen, die passende Collection zu nutzen."
