    content: "Ich werde das Winterbild in ein Sommerbild umwandeln. Dazu verwende ich den Bildgenerator-Agenten.\n\nIch lasse den image-generator das Bild bearbeiten und die winterlichen Elemente durch sommerliche ersetzen:\n- Schnee wird durch grüne Wiesen ersetzt\n- Die kahlen Bäume werden mit Blättern versehen\n- Die kalten Farbtöne werden durch warme, sonnige Farben ersetzt\n\n```json\n{\"name\": \"delegate_to_agent\", \"arguments\": {\"agent_id\": \"image-generator\", \"task\": \"Wandle das hochgeladene Winterbild in eine sommerliche Szene um. Ersetze Schnee durch grüne Wiesen, füge Blätter an die Bäume hinzu und verwandle die kalte Farbpalette in warme, sonnige Sommerfarben.\", \"context\": \"attachment_id: att-1771178263106-4pzo33\"}}\n```"
