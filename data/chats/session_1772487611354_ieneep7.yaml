title: Vereinbarkeit Familie und Beruf bei Krisensituation
summary: "Herr Müller, Vater zweier Teenager, steht vor einer psychischen Krisensituation seiner Kinder. Er sucht nach Lösungen, um beruflich präsent zu bleiben, ohne seine Grenzen zu überschreiten. Es werden Sabbatical, Stundenumstellung oder Projektdelegation diskutiert."
