title: Berufliche Belastung bei familiärer Krisensituation
summary: "Herr Müller, ein Senior Manager, sucht nach Lösungen für seine berufliche Präsenz während einer familiären psychischen Krise seiner Kinder. Empfohlen werden Sabbatical, Stundendekrease oder Projektdelegation."
