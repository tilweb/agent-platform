messages:
  - role: user
    content: "Welchen Umfang hat das IKS der Adacor?"
  - role: assistant
    content: "Das Informationssicherheitsmanagementsystem (IKS) der Adacor Hosting GmbH ist gemäß IDW PS 951 zertifiziert und umfasst umfassende Maßnahmen zur Sicherstellung der Informationssicherheit. Das IKS deckt folgende Bereiche ab:\n\n1. **Kontrollumfeld (KU):**\n   - Ethische Werte und Verhaltensvorgaben sind dokumentiert und werden eingehalten.\n   - Das Management zeigt Gewissenhaftigkeit und Weitsicht.\n   - Die Organisationsstruktur ermöglicht eine leistungsfähige Serviceerbringung.\n   - Grundsätze des Personalmanagements sind definiert und kommuniziert.\n   - Ein Qualitätsmanagementframework aus Prozessen und Tools ist implementiert.\n   - Eine Datenschutzorganisation ist implementiert.\n\n2. **Risikobeurteilung (RB):**\n   - Unternehmensziele, die durch Risiken gefährdet sein könnten, sind identifiziert und festgehalten.\n   - Relevante Risiken werden erfasst und in strukturierten Verfahren bewertet.\n   - Die Einhaltung von Richtlinien, Regelungen und Gesetzen wird überwacht.\n\n3. **Kontrollaktivitäten auf Prozessebene (KA):**\n   - **Service Design:**\n     - Service Level sind intern wie extern definiert und dokumentiert.\n     - Benötigte Kapazitäten werden zeitnah geplant und bereitgestellt.\n     - Maßnahmen zur Sicherstellung der Verfügbarkeit von Daten und Systemen sind implementiert.\n     - Ein Informationssicherheitsmanagementsystem (ISMS) nach ISO 27001 ist implementiert.\n     - Verfügbarkeitsanforderungen und relevante Parameter aller kritischen internen Assets sind inventarisiert und dokumentiert.\n     - Vorgaben und Richtlinien hinsichtlich Kriterien, Auswahl und Risiko sind definiert und dokumentiert.\n   - **Service Transition:**\n     - Changes werden auf Basis von Prozessdefinitionen, Checklisten sowie der benötigten System-, Service- und Projektinformationen durchgeführt.\n     - IT-Systeme und Servicekomponenten sind mit ihren jeweiligen Attributen und Changes in einem zentralen System hinterlegt.\n   - **Service Operation:**\n     - Incidents werden durch einen zentralen Service Desk und mithilfe geeigneter Tools entgegengenommen, registriert, dokumentiert, kommuniziert und bearbeitet.\n     - Service Requests werden zeitnah, strukturiert, qualifiziert und dokumentiert bearbeitet.\n     - Probleme werden erkannt, erfasst und priorisiert und zugeordnet.\n     - Authentifizierungsmechanismen sind sicher ausgestaltet.\n\n4. **Information und Kommunikation (IK-INF):**\n   - Informationen aus vertrauenswürdigen Quellen zu aktuellen und zukünftigen Trends und Regularien stehen zeitnah in geeigneter Weise zur Verfügung.\n   - Das interne Informationssystem stellt relevante Informationen, Reports und Kennzahlen der Serviceerbringung zeitnah den definierten Empfängern bereit.\n   - Relevante Informationen an Kunden und Partner werden über die vorgegebene Wege, strukturiert, zeitnah, vollständig, dokumentiert an alle geforderten Empfänger kommuniziert.\n\n5. **Überwachung des internen Kontrollsystems (ÜW):**\n   - Die Angemessenheit des IKS, der Kontrollziele und Kontrollen zur Erreichung der Business Ziele wird regelmäßig überprüft.\n   - Die einwandfreie Funktion der installierten Kontrollen wird regelmäßig geprüft.\n   - Notwendige korrigierende oder erweiternde Maßnahmen zur Verbesserung des IKS werden implementiert.\n\n### Ergänzende Details\n\n- **Zertifizierungen und Standards:**\n  - Das IKS ist gemäß IDW PS 951 zertifiziert.\n  - Ein Informationssicherheitsmanagementsystem (ISMS) nach ISO 27001 ist implementiert.\n\n### Quellen\n\n- **Quellen:**\n  - IKS-Beschreibung IDW PS 951 2021"
