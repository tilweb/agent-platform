title: Sabbatical für Manager mit familiären Krisen
summary: "Ein Senior Manager steht vor der Entscheidung, sein Arbeitspensum anzupassen, da seine Familie eine psychische Krise durchlebt. Es werden Optionen wie Sabbatical, Stundendegression oder Projektdelegation diskutiert."
