title: Nutzung des Dokumenten-Indexers in der Knowledge Base
summary: "Der Nutzer erfährt, wie der Indexer-Agent Dokumente in die Wissensdatenbank einträgt. Es gab ein Problem mit der Datei, die nicht gefunden wurde."
