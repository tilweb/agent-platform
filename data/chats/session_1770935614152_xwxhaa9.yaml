    content: "worum geht es in dem Vertrag?"
  - role: assistant
    content: "Der Vertrag zwischen **MedTech Solutions AG** und **CloudCare IT Services GmbH** regelt die Erbringung von **IT-Support- und Managed-Services** für den Auftraggeber (MedTech Solutions AG).  \n\n### Kernpunkte des Vertrags:\n1. **Vertragsgegenstand (§ 1)**  \n   - **Managed Services**:  \n     - Monitoring und Verwaltung der IT-Infrastruktur (75 Arbeitsplätze, 5 Server, Netzwerk, Cloud-Dienste wie Microsoft 365 und Azure).  \n     - Datensicherung, Patch-Management, IT-Sicherheit und Firewall-Management.  \n   - **Support-Leistungen**:  \n     - 1st- und 2nd-Level-Support (remote und vor Ort), Software-Installation, Hardware-Beschaffung.  \n   - **Projektleistungen**:  \n     - Beratung, Migration, Systemimplementierung und Dokumentation.  \n\n2. **Vertragslaufzeit und Kündigung (§ 2)**  \n   - Laufzeit: **01.03.2024 bis 28.02.2027** (Mindestlaufzeit 3 Jahre).  \n   - Automatische Verlängerung um 1 Jahr, sofern nicht mit 6 Monatsfrist gekündigt.  \n\n3. **Vergütung (§ 3)**  \n   - Monatliche Pauschale: **6.800,00 EUR** (netto) für Managed Services.  \n   - Zusätzliche Leistungen (z. B. Vor-Ort-Support ab 17. Stunde): **95,00 EUR/Stunde**.  \n   - Hardware/Software: Aufschlag von **12%** auf Einkaufspreis.  \n   - Zahlungsbedingungen: Rechnung bis 25. des Vormonats, Zahlung innerhalb von 14 Tagen.  \n\n4. **Service Level Agreement (SLA) (§ 4)**  \n   - **Verfügbarkeit**: 99,5% pro Monat (geplante Wartungsfenster ausgenommen).  \n   - **Reaktionszeiten** (nach Priorität):  \n     - **Priority 1 (kritisch)**: 30 Minuten Reaktionszeit, 4 Stunden Lösungszeit.  \n     - **Priority 2 (hoch)**: 2 Stunden Reaktionszeit, 8 Stunden Lösungszeit.  \n   - **Pönale bei SLA-Verletzungen**:  \n     - 5–20% Reduktion der monatlichen Vergütung je nach Verfügbarkeit.  \n\n5. **Pflichten des Auftraggebers (§ 5)**  \n   - Bereitstellung von Ansprechpartnern, Zugang zu Systemen und Information.  \n   - Benennung von Eskalationskontakten (z. B. IT-Leiter Martin Fischer).  \n\n6. **Berichtswesen (§ 6)**  \n   - Monatliche Reports bis zum 5. Werktag des Folgemonats (Support-Tickets, SLA, Wartungsarbeiten).  \n   - Quartalsweise Reviews zur Service-Qualität und strategischen Planung.  \n\n7. **Datenschutz und IT-Sicherheit (§ 7)**  \n   - Vertraulichkeit und Einhaltung der DSGVO (durch AVV geregelt).  \n   - Regelmäßige Sicherheitsupdates, tägliche Backups, jährliches IT-Sicherheitsaudit.  \n\n8. **Haftung (§ 8)**  \n   - Haftung beschränkt auf **100.000 EUR pro Schadensfall** (max. 300.000 EUR/Jahr).  \n   - Versicherung: Betriebshaftpflicht mit **2.000.000 EUR** Deckung.  \n\n9. **Geheimhaltung und Wettbewerbsverbot (§ 9)**  \n   - 2 Jahre nach Vertragsende kein Wettbewerb im Medizintechnik-Bereich (50 km Radius um Frankfurt).  \n\n10. **Anwendbares Recht (§ 13)**  \n    - Recht der Bundesrepublik Deutschland, Gerichtsstand: Frankfurt am Main.  \n\n### Anlagen:\n- Anlage 1: Leistungskatalog  \n- Anlage 2: Auftragsverarbeitungsvereinbarung (AVV)  \n- Anlage 3: IT-Infrastruktur-Dokumentation  \n\nDer Vertrag ist somit ein umfassender Rahmen für die IT-Unterstützung von MedTech Solutions AG durch CloudCare IT Services GmbH, mit klaren Leistungs-, Preis- und Qualitätsvereinbarungen."
