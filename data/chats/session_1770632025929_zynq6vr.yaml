messages:
  - role: user
    content: "Welche Einträge sind in der Tabelle Assets vorhanden?"
  - role: assistant
    content: "Ich habe versucht, die Einträge in der Tabelle \"Assets\" zu finden, aber leider konnte ich keine relevanten Informationen in der Wissensdatenbank finden. Anschließend habe ich eine Webrecherche durchgeführt, um die gewünschten Daten zu erhalten, aber auch diese Recherche war nicht erfolgreich.\n\nIch empfehle Ihnen, die Suche manuell durchzuführen oder weitere Details bereitzustellen, damit ich Ihre Anfrage genauer eingrenzen kann. Wenn Sie zusätzliche Informationen haben, lassen Sie es mich bitte wissen, und ich werde mein Bestes tun, um Ihnen zu helfen."
