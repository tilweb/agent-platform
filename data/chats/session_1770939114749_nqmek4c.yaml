    content: "Es geht um einen Mietvertrag für eine Wohnung in München, der zwischen der Immobilien Mustermann GmbH und Max Mustermann abgeschlossen wurde. Der Vertrag betrifft die Wohnung an der Sonnenallee 789, 80331 München, mit einer Wohnfläche von 85 qm und 3 Zimmern. Der Mietvertrag ist befristet und läuft vom 1. Januar 2024 bis zum 31. Dezember 2026. Die monatliche Gesamtmiete beträgt 1.700,00 EUR, wobei die Kaltmiete 1.450,00 EUR und die Nebenkosten 250,00 EUR betragen. Die Kaution beträgt 4.350,00 EUR, was drei Monatskaltmieten entspricht. Die Miete ist monatlich im Voraus zu zahlen, und die Kündigung kann mit einer Frist von 3 Monaten zum Monatsende erfolgen. Der Vertrag enthält auch Bestimmungen zur Instandhaltung, Nutzung der Mietsache, Nebenpflichten und Schlussbestimmungen."
