  - role: user
    content: "Erstelle einen detaillierten Social Media Plan für LinkedIn zur Bewerbung des KI Workplace. Der Plan soll bis zum 18.02. für die W3 Fair in Wetzlar fertig sein. Der Plan sollte folgende Elemente enthalten:\n\n1. Zielsetzung: Was soll mit den LinkedIn-Posts erreicht werden?\n2. Zielgruppe: Wer soll angesprochen werden?\n3. Content-Strategie: Welche Inhalte sollen gepostet werden?\n4. Posting-Plan: Wann und wie oft sollen Posts veröffentlicht werden?\n5. Engagement-Strategie: Wie soll auf Interaktionen reagiert werden?\n6. Erfolgsmessung: Welche KPIs sollen verwendet werden, um den Erfolg zu messen?\n7. Visuelle Gestaltung: Welche visuellen Elemente sollen verwendet werden?\n8. Hashtag-Strategie: Welche Hashtags sollen verwendet werden?\n\nDer Plan sollte spezifisch und umsetzbar sein und auf die W3 Fair in Wetzlar abgestimmt sein.\n\nKontext: Der Benutzer möchte einen LinkedIn Social Media Plan für den KI Workplace, der bis zum 18.02. für die W3 Fair in Wetzlar fertig sein soll. Der Plan soll detailliert und umsetzbar sein und alle wichtigen Aspekte der Social Media-Strategie abdecken.\n\nKontext: Der Benutzer möchte einen LinkedIn Social Media Plan für den KI Workplace, der bis zum 18.02. für die W3 Fair in Wetzlar fertig sein soll. Der Plan soll detailliert und umsetzbar sein und alle wichtigen Aspekte der Social Media-Strategie abdecken."
