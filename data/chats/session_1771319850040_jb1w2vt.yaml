  - role: assistant
    content: "Ich verstehe, dass du ein Bild generieren möchtest. Bitte beschreibe, was du gerne sehen würdest — zum Beispiel eine Szene, ein Objekt, eine Person oder eine bestimmte Atmosphäre. Je detaillierter du bist, desto besser kann ich den Bild-Generator anweisen.\n\nBeispiele:\n- \"Erstelle ein fotorealistisches Bild einer Winterlandschaft mit schneebedeckten Bergen und einem zugefrorenen See im Vordergrund.\"\n- \"Mache daraus ein Sommerbild: Ersetze Schnee durch grüne Wiesen und füge Blumen hinzu.\"\n- \"Zeichne mir ein futuristisches Stadtpanorama bei Sonnenuntergang mit fliegenden Autos.\"\n\nGib mir deine Vorstellung, und ich lasse den Bild-Generator loslegen."
