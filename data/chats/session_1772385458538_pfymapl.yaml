title: Berufliche Belastung bei familiärer Krisensituation
summary: "Herr Müller, ein Senior Manager, steht vor der Herausforderung, beruflich präsent zu bleiben, während seine Familie eine psychische Krise durchlebt. Er erwägt Entlastungsmaßnahmen wie Sabbatical oder Stundensenkung."
