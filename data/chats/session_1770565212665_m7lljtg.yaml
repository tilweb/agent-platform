    content: "Warum ist der Himmel blau?"
  - role: assistant
    content: "Der Himmel erscheint blau aufgrund der Streuung des Sonnenlichts in der Erdatmosphäre. Dieses Phänomen wird als Rayleigh-Streuung bezeichnet. Kurze Wellenlängen des Lichts, insbesondere blaues Licht, werden stärker gestreut als längere Wellenlängen wie rot oder gelb. Wenn das Sonnenlicht die Atmosphäre durchdringt, wird das blaue Licht in alle Richtungen gestreut, wodurch der Himmel für uns blau erscheint."
  - role: user
    content: "Was ist der Frankfurter Dom?"
  - role: user
    content: /write
