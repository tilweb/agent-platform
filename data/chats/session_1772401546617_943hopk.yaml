title: Sabbatical für psychische Belastung
summary: "Herr Müller, Senior Manager, sucht Unterstützung bei beruflicher Belastung durch die psychische Krise seines Kindes. Er erwägt Sabbatical, Stundenumstellung oder Projektdelegation."
