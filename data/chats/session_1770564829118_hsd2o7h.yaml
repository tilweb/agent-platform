    content: "Was ist der Frankfurter Dom?"
  - role: assistant
    content: "Der Frankfurter Dom, auch Kaiserdom St. Bartholomäus genannt, ist eine bedeutende Kirche in Frankfurt am Main, Deutschland. Er wurde im 14. Jahrhundert erbaut und ist bekannt für seine gotische Architektur. Der Dom ist ein Symbol der Stadt und war historisch ein wichtiger Ort für die Krönung deutscher Könige und Kaiser. Heute ist er eine der Hauptattraktionen Frankfurts und ein beliebtes Touristenziel."
