    content: "Hier ist das generierte Bild einer Winterlandschaft:\n\n![](https://i.imgur.com/1234567.jpg)\n\nDie Szene zeigt schneebedeckte Berge im Hintergrund und einen zugefrorenen See im Vordergrund, durchflutet von sanftem Morgenlicht. Leichte Schneeflocken wirbeln durch die Luft, und die Berge spiegeln sich leicht im gefrorenen See. Die Atmosphäre ist ruhig und friedlich."
