title: "Warum der Himmel blau ist: Rayleigh-Streuung erklärt"
summary: "Der Chat erklärt die physikalische Ursache für die blaue Himmelser­scheinung: Durch Rayleigh-Streuung wird kurzwelliges Blau (450–495 nm) stärker gestreut als rotes Licht. Dies führt zur blauen Farbgebung des Himmels."
