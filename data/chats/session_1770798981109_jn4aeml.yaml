    content: "Fasse \"Konzeptentwurf_Digitalforum Souveränität.pdf\" zusammen"
  - role: assistant
    content: "Hier ist eine strukturierte Zusammenfassung des Dokuments \"Konzeptentwurf_Digitalforum Souveränität.pdf\":\n\n## Überblick\nDas Digitalforum \"Digitale Souveränität in der Industrie\" findet am 11.03.2026 in Frankfurt am Main statt. Es beschäftigt sich mit der Balance zwischen digitaler Innovation und dem Schutz von Know-how in der Industrie, insbesondere vor dem Hintergrund geopolitischer Spannungen und regulatorischer Anforderungen.\n\n## Hauptpunkte\n- **Ausgangslage**: Die hessische Industrie steht vor Herausforderungen durch Abhängigkeit von digitalen Infrastrukturen, geopolitische Unsicherheiten und regulatorische Anforderungen.\n- **Zielsetzung**: Das Forum soll praxisnahe Entscheidungsgrundlagen für Industrieunternehmen schaffen, um digitale Innovation und Know-how-Schutz zu vereinbaren.\n- **Ablauf**: Das Forum beginnt mit einer Keynote von Prof. Dr. Michael Waidner, gefolgt von Praxis-Impulsen aus vier Perspektiven:\n  1. **Adacor**: Industrie-Betriebsrealität und Verantwortung\n  2. **Meshcloud**: Governance und Steuerbarkeit\n  3. **Adastra**: Innovations- und Plattformperspektive\n  4. **Inheaden**: Europäische Plattformoptionen\n- **Diskussion**: Gemeinsame Diskussion mit dem Publikum zu Themen wie funktionierende Lösungen, Risiken für Know-how, notwendige Governance und Innovationsverluste.\n\n## Fazit\nDas Digitalforum zielt darauf ab, ein realistisches Gesamtbild der digitalen Souveränität in der Industrie zu schaffen, ohne bestimmte Anbieter oder Technologien zu bevorzugen oder auszuschließen. Es soll eine gemeinsame Diskussionsbasis für die Praxis schaffen und unternehmensspezifische Antworten aufzeigen."
