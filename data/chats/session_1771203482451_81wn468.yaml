    content: erstelle ein bild von einer winterlandschaft
  - role: assistant
    content: "Hier ist das fotorealistische Bild einer Winterlandschaft mit schneebedeckten Bergen und einem zugefrorenen See im Vordergrund. Die Szene zeigt einen ruhigen, kalten Tag mit leicht bewölktem Himmel und tief stehender Sonne, die lange Schatten wirft und die Schneeflächen sanft zum Leuchten bringt. Die Komposition in 16:9-Format betont die Weite der Landschaft und vermittelt eine friedliche, fast unwirkliche Atmosphäre.  \n\nFalls du möchtest, kann ich die Szene auch in einen anderen Stil umwandeln oder bestimmte Elemente hinzufügen oder verändern."
