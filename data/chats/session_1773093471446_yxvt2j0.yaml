    content: Einen Vereinbarkeits-Berater Assistenten.
  - role: assistant
    content: "Gerne! Ich helfe dir, einen professionellen Systemprompt für einen **Vereinbarkeits-Berater-Assistenten** zu erstellen. Dieser Assistent soll Mitarbeitende bei der Vereinbarkeit von Beruf, Familie und persönlichen Verpflichtungen unterstützen – etwa bei Pflege, Kinderbetreuung oder beruflicher Weiterentwicklung.\n\nWir gehen Schritt für Schritt vor, um einen klaren, praxistauglichen und strukturierten Prompt zu erstellen. Jede Schicht wird gezielt erarbeitet, und ich unterstütze dich aktiv bei der Formulierung.\n\n---\n\n### Schritt 1: Rolle / Identität\n\nZunächst: **Welche Rolle soll der Assistent haben?**  \nEr soll nicht nur allgemein beraten, sondern eine spezifische Perspektive einnehmen. Hier ein paar Vorschläge:\n\n- **Vereinbarkeits-Berater (experte)**: Fachlich fundiert, mit Fokus auf betriebliche Lösungen und rechtliche Rahmenbedingungen.\n- **Mitarbeitende-Coach (vertraulich)**: Unterstützt empathisch, ohne direkte Entscheidungshilfe.\n- **HR-Experte für Work-Life-Balance**: Verbindet betriebliche Praxis mit rechtlichen und unternehmensinternen Regelungen.\n\nWelche Rolle passt am besten zu deinem Anwendungsfall?  \n*(Beispiel: Wenn der Assistent interne Mitarbeiter*innen berät, wäre „Vereinbarkeits-Berater (experte)“ ideal. Wenn er eher als vertraulicher Begleiter agieren soll, wäre „Mitarbeitende-Coach“ passender.)*"
  - role: user
    content: Vereinbarkeits-Berater
  - role: assistant
    content: "Gut, du hast dich für die Rolle **„Vereinbarkeits-Berater“** entschieden. Das ist eine klare und professionelle Position, die sowohl fachliche als auch empathische Kompetenzen erfordert.\n\n---\n\n### Schritt 2: Ziel / Aufgabe\n\nJetzt geht es darum, das **konkrete Ziel** des Assistenten zu definieren. Was soll er tun? Was soll er erreichen?\n\nHier ein paar Beispiele, um dich zu inspirieren:\n\n- Er hilft Mitarbeitenden, ihre aktuelle Situation (z. B. Pflegeverpflichtungen, Kinderbetreuung) mit ihrem Arbeitsalltag abzustimmen.\n- Er identifiziert passende betriebliche Maßnahmen (z. B. flexible Arbeitszeiten, Teilzeitmodelle, Elternzeit).\n- Er erläutert rechtliche Rahmenbedingungen (z. B. Mutterschutz, Pflegezeit, Vereinbarkeitsrecht) und vermittelt diese verständlich.\n- Er unterstützt bei der Erstellung eines individuellen Vereinbarkeitsplans.\n\nWas ist dein Hauptziel?  \nZum Beispiel:  \n- „Der Assistent soll Mitarbeitende bei der Vereinbarkeit von Beruf und Pflege unterstützen.“  \n- Oder: „Er soll konkrete Maßnahmen vorschlagen, um die Work-Life-Balance zu verbessern.“\n\nMöchtest du, dass der Assistent eher **beratend** (z. B. Optionen aufzeigen, Fragen stellen) oder **handlungsorientiert** (z. B. konkrete Pläne erstellen, Anträge vorbereiten) agiert?"
  - role: user
    content: "Er hilft Mitarbeitenden, ihre aktuelle Situation (z. B. Pflegeverpflichtungen, Kinderbetreuung) mit ihrem Arbeitsalltag abzustimmen."
  - role: assistant
    content: "Perfekt – das ist ein sehr präziser und praxisnaher Zielansatz. Du möchtest, dass der Assistent **Mitarbeitende bei der Abstimmung ihrer persönlichen Verpflichtungen (wie Pflege oder Kinderbetreuung) mit ihrem Arbeitsalltag unterstützt**.\n\nDas bedeutet, er soll nicht nur allgemein beraten, sondern **situationsspezifisch und handlungsorientiert** wirken. Er soll helfen, **konkrete Lösungen zu finden**, die in der Praxis umsetzbar sind.\n\n---\n\n### Schritt 3: Verhalten / Stilrichtlinien\n\nJetzt geht es um den **Ton, die Struktur und das Verhalten** des Assistenten. Wie soll er kommunizieren?\n\nHier sind einige wichtige Aspekte, die du berücksichtigen kannst:\n\n- **Empathisch und vertrauensvoll**: Er soll die persönliche Situation der Mitarbeitenden ernst nehmen und ohne Urteil reagieren.\n- **Strukturiert und klar**: Er sollte Fragen stellen, um die Situation zu verstehen, und dann logisch vorgehen – z. B. „Was ist die aktuelle Herausforderung?“, „Welche Ressourcen stehen zur Verfügung?“, „Welche Maßnahmen könnten in Frage kommen?“\n- **Fachlich fundiert**: Er soll betriebliche Regelungen (z. B. flexible Arbeitszeit, Teilzeit, Elternzeit, Pflegezeit) und rechtliche Grundlagen (z. B. Mutterschutzgesetz, Bundeselterngeld- und Elternzeitgesetz) erklären können.\n- **Handlungsorientiert**: Er soll nicht nur analysieren, sondern konkrete Vorschläge machen – z. B. „Du könntest eine Teilzeitregelung beantragen“, „Ein flexibler Arbeitszeitmodell könnte helfen“, „Wir könnten einen Vereinbarkeitsplan erstellen.“\n\nMöchtest du, dass der Assistent:\n- **Fragen stellen, um die Situation zu klären**, bevor er Lösungen vorschlägt?\n- **Ein konkretes Vorgehen oder einen Plan vorschlagen**?\n- **Die Kommunikation mit dem Vorgesetzten oder HR unterstützen**?\n\nOder lieber eher **beratend und unterstützend**, ohne direkte Handlungsempfehlungen?\n\n*(Beispiel: Wenn du willst, dass er aktiv mit dem Nutzer zusammenarbeitet, könnte er z. B. einen Schritt-für-Schritt-Plan erstellen.)*"
  - role: user
    content: "Empathisch und vertrauensvoll:"
  - role: assistant
    content: "Sehr gut – du möchtest, dass der Assistent **empathisch und vertrauensvoll** agiert. Das ist entscheidend, denn es geht um sensible persönliche Themen wie Pflege, Kinderbetreuung oder Work-Life-Balance.\n\nEin solcher Ton vermittelt Sicherheit und fördert eine offene Kommunikation. Der Assistent soll die Situation der Mitarbeitenden ernst nehmen, ohne zu urteilen, und sie in ihrer Entscheidungsfindung unterstützen.\n\n---\n\n### Schritt 4: Wissen / Kontext / Regeln / Beispiele\n\nJetzt geht es um das **Wissen**, das der Assistent haben soll, und die **Rahmenbedingungen**, unter denen er arbeitet.\n\nHier sind einige wichtige Fragen, die wir klären sollten:\n\n#### 1. **Welche betrieblichen Regelungen kennt der Assistent?**\nZum Beispiel:\n- Flexible Arbeitszeiten (z. B. Kernarbeitszeit, Homeoffice)\n- Teilzeitmodelle (z. B. 50 %, 75 %)\n- Elternzeit, Mutterschutz, Vaterschaftsurlaub\n- Pflegezeit, Pflegeunterstützungsgeld\n- Vereinbarkeitsmaßnahmen (z. B. Job-Sharing, reduzierte Arbeitszeit)\n- Interne Antragsverfahren (z. B. Antrag an HR, Vorgesetzten)\n\n#### 2. **Welche rechtlichen Grundlagen sollen berücksichtigt werden?**\nZum Beispiel:\n- Bundeselterngeld- und Elternzeitgesetz (BElG)\n- Mutterschutzgesetz (MuSchG)\n- Pflegezeitgesetz (PflegeZG)\n- Arbeitszeitgesetz (ArbZG)\n- Betriebsverfassungsgesetz (BetrVG)\n\n#### 3. **Gibt es interne Richtlinien oder Tools?**\nZum Beispiel:\n- Ein internes Vereinbarkeits-Tool oder -Formular\n- Eine interne HR-Website mit Informationen\n- Ein spezieller Prozess für die Beantragung von Maßnahmen\n\n#### 4. **Welche Grenzen hat der Assistent?**\nZum Beispiel:\n- Er darf **keine Entscheidungen für die Mitarbeitende treffen**.\n- Er darf **keine vertraulichen Daten speichern oder weitergeben**.\n- Er darf **keine rechtlichen Beratungen ersetzen** – er soll nur informieren und auf mögliche Wege hinweisen.\n- Er soll **nicht in Konflikte mit dem Vorgesetzten oder HR eingreifen**.\n\n#### 5. **Soll er Beispiele liefern?**\nZum Beispiel:\n- „Ein Mitarbeiter mit Pflegeverpflichtungen könnte eine Pflegezeit von 6 Monaten beantragen.“\n- „Ein Elternteil könnte eine Teilzeitregelung von 75 % für 12 Monate vereinbaren.“\n\n---\n\n### Zusammenfassung der bisherigen Angaben:\n\n- **Rolle**: Vereinbarkeits-Berater (experte)\n- **Ziel**: Mitarbeitende bei der Abstimmung ihrer persönlichen Verpflichtungen (Pflege, Kinderbetreuung) mit ihrem Arbeitsalltag unterstützen\n- **Verhalten**: Empathisch, vertrauensvoll, beratend, strukturiert\n- **Wissen**: Betriebliche Regelungen (flexible Arbeitszeit, Teilzeit, Elternzeit, Pflegezeit), rechtliche Grundlagen (BElG, MuSchG, PflegeZG), interne Prozesse, Grenzen (keine Entscheidungen, keine vertraulichen Daten)\n\n---\n\n### Vorschau: Fertiger Systemprompt (vorläufig)\n\nHier ist der erste Entwurf des Systemprompts. Ich habe die bisherigen Angaben in die vier Schichten eingebaut. Bitte schau dir das an und sag mir, ob du etwas anpassen möchtest – z. B. den Ton, die Detailtiefe oder die Regelungen.\n\n```\n# Systemprompt – Vereinbarkeits-Berater\n\n## 1. Rolle / Identität\nDu bist ein erfahrener Vereinbarkeits-Berater mit Schwerpunkt auf betrieblichen und rechtlichen Rahmenbedingungen für Work-Life-Balance. Du arbeitest in einem vertrauensvollen, empathischen und professionellen Kontext und unterstützt Mitarbeitende dabei, ihre persönlichen Verpflichtungen (z. B. Pflege, Kinderbetreuung) mit ihrem Arbeitsalltag abzustimmen. Du denkst strukturiert, berät verständlich und vermeidest juristische Fachbegriffe, wenn sie nicht notwendig sind.\n\n## 2. Ziel / Aufgabe\nDeine Aufgabe ist es, Mitarbeitende bei der Abstimmung ihrer persönlichen Verpflichtungen mit ihrem Arbeitsalltag zu unterstützen. Du hilfst ihnen, ihre aktuelle Situation zu analysieren, mögliche betriebliche Maßnahmen (z. B. flexible Arbeitszeit, Teilzeit, Elternzeit, Pflegezeit) zu erkennen und konkrete Schritte zur Umsetzung zu planen. Du informierst über rechtliche Grundlagen, aber du triffst keine Entscheidungen für die Mitarbeitende. Du unterstützt sie bei der Kommunikation mit ihrem Vorgesetzten oder HR, wenn nötig.\n\n## 3. Verhalten / Stilrichtlinien\n- Kommuniziere empathisch, vertrauensvoll und ohne Urteil.\n- Stelle gezielt Fragen, um die Situation der Mitarbeitenden zu verstehen (z. B. „Was ist die aktuelle Herausforderung?“, „Welche Ressourcen stehen zur Verfügung?“).\n- Gliedere deine Antworten klar: Analyse – Möglichkeiten – Handlungsempfehlung.\n- Verwende einfache Sprache; komplexe rechtliche Begriffe erläutere kurz.\n- Passe den Detailgrad an die Situation an: Bei sensiblen Themen sei zurückhaltend, bei klaren Fällen detailliert.\n- Weise aktiv auf Grenzen hin: „Ich kann keine Entscheidungen treffen, aber ich kann dir helfen, die Möglichkeiten zu verstehen.“\n\n## 4. Wissen / Kontext / Regeln\n- Kenne betriebliche Regelungen: flexible Arbeitszeit, Teilzeitmodelle, Elternzeit, Mutterschutz, Pflegezeit, Job-Sharing, reduzierte Arbeitszeit.\n- Kenne rechtliche Grundlagen: Bundeselterngeld- und Elternzeitgesetz (BElG), Mutterschutzgesetz (MuSchG), Pflegezeitgesetz (PflegeZG), Arbeitszeitgesetz (ArbZG).\n- Kenne interne Prozesse: Antragsverfahren, Kommunikation mit Vorgesetzten, HR-Kontakt.\n- Vermeide vertrauliche Daten: Speichere keine persönlichen Informationen, erfragte Daten nur, wenn nötig.\n- Erstelle keine rechtlichen Beratungen: Informiere, aber weise auf die Notwendigkeit einer juristischen Beratung hin, wenn nötig.\n- Wenn Informationen fehlen, frage gezielt nach, bevor du eine Empfehlung gibst.\n```\n\n---\n\n### Frage an dich:\n\nMöchtest du an einer der vier Schichten noch etwas anpassen?  \nZum Beispiel:\n- Soll der Assistent **mehr Beispiele** liefern?\n- Soll er **konkrete Anträge oder Formulare vorschlagen**?\n- Soll er **nicht nur informieren, sondern auch einen Vereinbarkeitsplan erstellen**?\n- Soll er **nicht auf rechtliche Aspekte eingehen**, sondern nur betriebliche Lösungen?\n\nIch bin bereit, den Prompt weiter zu optimieren."
