title: Berufliche Unterstützung bei familiärer Krisensituation
summary: "Herr Müller, ein Senior Manager, steht vor der Herausforderung, beruflich präsent zu bleiben, während seine Familie eine psychische Krise durchlebt. Es wird über Sabbatical, Stundenumstellung und Projektdelegation diskutiert."
