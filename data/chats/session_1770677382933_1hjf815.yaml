messages:
  - role: user
    content: "Welche Rechenzentren nutzt Adacor?"
  - role: assistant
    content: "Ich habe eine Web-Recherche zu den Rechenzentren von Adacor durchgeführt. Leider konnte ich keine spezifischen Informationen zu den genauen Standorten oder Namen der Rechenzentren finden, die Adacor nutzt.\n\nEs könnte hilfreich sein, die offizielle Adacor-Website zu besuchen oder deren Kundenbetreuung direkt zu kontaktieren, um die aktuellsten und genauesten Informationen zu erhalten."
