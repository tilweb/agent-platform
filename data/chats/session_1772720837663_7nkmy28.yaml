    content: Erstell bitte einen Arbeitsvertrag
  - role: assistant
    content: "Ich lasse den Paul Personalmanagement-Agenten einen Arbeitsvertrag für dich erstellen. Dafür benötige ich einige Informationen:\n\n1. **Persönliche Daten des Mitarbeiters** (Name, Adresse, Geburtsdatum)\n2. **Daten des Arbeitgebers** (Firmenname, Adresse, Vertreter)\n3. **Arbeitsplatz und Tätigkeit** (Stellenbezeichnung, Aufgaben)\n4. **Beginn der Beschäftigung** (Startdatum)\n5. **Dauer des Arbeitsverhältnisses** (unbefristet, befristet mit Enddatum)\n6. **Arbeitszeit** (Vollzeit, Teilzeit, Stundenzahl pro Woche)\n7. **Entgelt** (Bruttogehalt, Zahlungsweise)\n8. **Sonstige Vereinbarungen** (Urlaub, Probezeit, Kündigungsfristen)\n\nBitte gib mir diese Informationen, damit der Paul Personalmanagement-Agent den Arbeitsvertrag entsprechend erstellen kann."
