    content: "•	Position: Softwareentwickler\n	•	Arbeitszeit: 40 Stunden pro Woche\n	•	Vertragsbeginn: 01.07.2026\n	•	Probezeit: 6 Monate\n	•	Gehalt: 5000 EUR"
