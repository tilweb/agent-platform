    content: "Ich verstehe deine Frage nicht vollständig. Könntest du bitte präzisieren, worauf du dich beziehst?  \n\nBist du nach einer bestimmten Information, einem Dokument oder einer Aussage gefragt? Oder möchtest du, dass ich etwas aus einem bestimmten Kontext zusammenfasse?  \n\nBitte gib mir mehr Details, damit ich dir helfen kann."
