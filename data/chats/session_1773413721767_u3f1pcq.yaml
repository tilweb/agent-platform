    content: Erstell bitte einen Arbeitsvertrag für Marc Richter.
  - role: assistant
    content: "Um einen Arbeitsvertrag für Marc Richter zu erstellen, benötige ich folgende Informationen:\n\n1. **Vollständiger Name**: Marc Richter (bestätigt)  \n2. **Personalnummer** (falls vorhanden)  \n3. **Abteilung & direkte Führungskraft**  \n4. **Eintrittsdatum**  \n5. **Vertragsart** (z.B. unbefristet, befristet, Teilzeit)  \n6. **Stellenbezeichnung**  \n7. **Arbeitszeit (z.B. 40h/Woche, 38h/Woche)**  \n8. **Gehaltsangabe** (Bruttogehalt, Zahlungsweise)  \n9. **Beginn der Probezeit** (falls relevant)  \n10. **Sonstige besondere Vereinbarungen** (z.B. Homeoffice, Reisekosten, Bonus)\n\nBitte gib mir diese Daten, damit ich den Arbeitsvertrag entsprechend erstellen kann."
