title: Sabbatical für psychisch belastete Führungskraft
summary: "Herr Müller, ein Senior Manager mit psychisch krisenbelastetem Teenager-Kind, erwägt ein Sabbatical oder Stundensenkung. Ein Vereinbarkeits-Berater soll eine Maßnahmenplan erstellen, um berufliche und persönliche Belastungen abzubauen."
