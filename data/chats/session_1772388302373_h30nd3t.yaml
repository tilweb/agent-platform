messages:
  - role: user
    content: "Einer unserer Senior Manager im Vertrieb, Herr Müller, ist Vater von zwei Teenager-Kindern. Eines der Kinder befindet sich aktuell in einer psychischen Krisensituation, was die gesamte Familie stark belastet. Er möchte beruflich möglichst präsent bleiben, merkt aber, dass er in der aktuellen Lage mental an seine Grenzen kommt. Er denkt über ein Sabbatical, Reduktion der Wochenstunden oder eine temporäre Delegation von Projektverantwortung nach."
  - role: assistant
    content: "Ich lasse den Vereinbarkeits-Berater die Situation analysieren und einen Maßnahmenplan für Herrn Müller erstellen.  \n\nIch delegiere an den **vereinbarkeits-berater** mit folgender Aufgabe:  \n\"Analyse die Situation von Herrn Müller, einem Senior Manager im Vertrieb mit zwei Teenager-Kindern, von denen eines in einer psychischen Krisensituation ist. Er möchte beruflich präsent bleiben, merkt aber, dass er mental an seine Grenzen kommt. Er erwägt ein Sabbatical, eine Reduktion der Wochenstunden oder eine temporäre Delegation von Projektverantwortung. Erstelle einen detaillierten Maßnahmenplan mit konkreten Empfehlungen, die sowohl seine berufliche Verantwortung als auch die Belastung seiner Familie berücksichtigen. Berücksichtige auch rechtliche und unternehmensinterne Rahmenbedingungen, die für solche Maßnahmen relevant sind.\"  \n\nIch warte auf das Ergebnis des Vereinbarkeits-Beraters."
