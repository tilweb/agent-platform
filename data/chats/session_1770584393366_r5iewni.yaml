    content: "Was sind die neuesten Files in meinem Google Drive?"
  - role: assistant
    content: "Um auf Ihre Google Drive-Dateien zuzugreifen, müssen Sie den Dienst zunächst auf der Connections-Seite verbinden. Könnten Sie das bitte erledigen? Sobald die Verbindung hergestellt ist, kann ich Ihnen die neuesten Dateien anzeigen."
