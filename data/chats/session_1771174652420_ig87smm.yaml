    content: "Ich analysiere deine Anfrage und plane den nächsten Schritt.\n\nDu möchtest ein Bild einer Winterlandschaft erstellen. Dafür benötige ich einen spezialisierten Agenten, der Bilder generieren kann. Ich werde den entsprechenden Agenten delegieren, um das Bild zu erstellen.\n\nIch lasse den Image-Generator-Agenten ein Bild einer Winterlandschaft erstellen. Dazu werde ich einen detaillierten Prompt erstellen, der die gewünschte Szene beschreibt.\n\nIch werde nun den Bildgenerator mit einem optimierten Prompt beauftragen, um das gewünschte Bild zu erstellen."
