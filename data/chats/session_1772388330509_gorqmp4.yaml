title: Berufliche Belastung durch familiäre Krisensituation
summary: "Herr Müller, Senior Manager, steht vor einer psychischen Krisensituation seines Kindes und überlegt, berufliche Verantwortung durch Sabbatical oder Stundendegression zu reduzieren, um seine Belastung zu verringern."
