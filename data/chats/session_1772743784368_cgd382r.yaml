    content: Mach bitte eine Featureanalyse von vanta.com
  - role: assistant
    content: "Hier ist die Featureanalyse von vanta.com basierend auf der durchgeführten Recherche:\n\n### **Überblick**\nVanta.com ist eine führende Plattform für automatisierte Compliance, Risikomanagement und Vertrauensmanagement, die durch KI-gestützte Lösungen und eine agentic Trust Management Platform gekennzeichnet ist. Das Unternehmen unterstützt Unternehmen dabei, ihre Sicherheits- und Compliance-Programme zu automatisieren und zu optimieren. Vanta wurde im IDC MarketScape 2025 als Leader in GRC-Software ausgezeichnet und verfügt über eine SOC 2 Type II und ISO 27001 Zertifizierung.\n\n### **Hauptfunktionen**\n- **Automatisierte Compliance**: Vanta unterstützt über 35 Rahmenwerke wie SOC 2, ISO 27001, HIPAA, GDPR und NIST AI Risk Management Framework.\n- **Kontinuierliches GRC (Governance, Risk, Compliance)**: Automatisierte Workflows für Beweiscollektion, kontinuierliche Überwachung und Risikomanagement.\n- **Vendor Risk Management**: Kontinuierliches Monitoring von Lieferanten und Partnern.\n- **Trust Center und Fragebogen-Automatisierung**: Automatisierte Erstellung und Verwaltung von Vertrauenszentren und Compliance-Fragebögen.\n\n### **Produkte und Dienstleistungen**\n- **Compliance-Software**: Automatisierte Beweiscollektion und kontinuierliche Überwachung für verschiedene Rahmenwerke.\n- **GRC-Software-Tool**: Funktionen wie Policy-Management, Personal-Management, Vorlagen für Kontrollen und integrierte Partnerschaften (z.B. Penetrationstests, Cyber-Versicherungen).\n- **Spezialisierte Lösungen**: Angebote für Startups, Mittelstand und Unternehmen unterschiedlicher Größen.\n\n### **Sicherheitsfeatures und Compliance-Lösungen**\n- **Zertifizierungen**: SOC 2 Type II, ISO 27001, GDPR-konform.\n- **Datenverschlüsselung**: Verschlüsselung von Daten (at rest und in transit) mit TLS 1.2+ und HSTS. Sensible Daten werden feldweise verschlüsselt.\n- **Sicherheitsmaßnahmen**: Jährliche Penetrationstests, SAST, SCA, DAST, Netzwerk-Vulnerability-Scanning und EASM.\n- **Identity and Access Management**: Nutzung von Okta für phishing-resistente Authentifizierungsmethoden.\n\n### **Integrationsmöglichkeiten**\n- **Über 400 Integrationen**: Mit Cloud-Anbietern (AWS, Azure, GCP), Version Control (GitHub), Task-Management (Jira), Identity Provider (Okta), Vulnerability-Scanner, MDM, HRIS, CRM, Kommunikationsplattformen und mehr.\n- **API**: Entwicklung von öffentlichen und privaten Integrationen über OAuth.\n\n### **Preisstrukturen und Support**\n- **Preispläne**: Essentials, Plus, Professional, Pro und Enterprise, mit Preisen von $10.000 bis $100.000+ pro Jahr.\n- **Support**: Verfügbar montags bis freitags von 6 Uhr bis 20 Uhr ET über Live-Chat und Schulungen.\n\n### **Schlussfolgerungen**\n- Vanta ist eine führende Plattform für automatisierte Compliance, Risikomanagement und Vertrauensmanagement.\n- Die Plattform reduziert die Audit-Zeit um 50% und erhöht die Produktivität von Compliance-Teams um 129%.\n- Vanta verfügt über eine SOC 2 Type II und ISO 27001 Zertifizierung und ist GDPR-konform.\n- Die Plattform integriert sich mit über 400 Tools aus verschiedenen Kategorien.\n- Vanta bietet fünf Preispläne mit Preisen von $10.000 bis $100.000+ pro Jahr.\n\n### **Offene Fragen / Wissenslücken**\n- Die genauen Preise für jeden Plan sind nicht angegeben, sondern nur geschätzt.\n- Die genauen Funktionen und Unterschiede zwischen den Plänen sind nicht detailliert beschrieben.\n\n### **Quellen**\n- [1] https://www.vanta.com/\n- [2] https://www.vanta.com/\n- [3] https://www.vanta.com/company/security\n- [4] https://www.vanta.com/integrations\n- [5] https://www.vanta.com/pricing"
