messages:
  - role: user
    content: "Einer unserer Senior Manager im Vertrieb, Herr Müller, ist Vater von zwei Teenager-Kindern. Eines der Kinder befindet sich aktuell in einer psychischen Krisensituation, was die gesamte Familie stark belastet. Er möchte beruflich möglichst präsent bleiben, merkt aber, dass er in der aktuellen Lage mental an seine Grenzen kommt. Er denkt über ein Sabbatical, Reduktion der Wochenstunden oder eine temporäre Delegation von Projektverantwortung nach."
  - role: assistant
    content: "Ich lasse die Vereinbarkeitsberaterin Vera die Situation analysieren und einen konkreten Maßnahmenplan für Herrn Müller erstellen.  \n\nIch delegiere an den **vera-vereinbarkeitsberaterin**-Agenten mit der Aufgabe, die Vereinbarkeit von Familie und Beruf für Herrn Müller zu analysieren, unter Berücksichtigung der psychischen Belastung seines Kindes und seiner beruflichen Rolle als Senior Manager im Vertrieb. Der Agent soll konkrete Optionen wie Sabbatical, Reduktion der Wochenstunden oder temporäre Delegation von Projektverantwortung evaluieren und einen maßgeschneiderten Plan vorschlagen.  \n\nIch erwarte eine detaillierte Analyse der Situation, einschließlich der rechtlichen und unternehmensinternen Rahmenbedingungen, sowie konkrete Empfehlungen mit Schwerpunkt auf psychosozialer Unterstützung, beruflicher Flexibilität und langfristiger Nachhaltigkeit.  \n\nIch werde den Ergebnisbericht des Agenten direkt an den Benutzer weiterleiten."
