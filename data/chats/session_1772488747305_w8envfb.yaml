title: Vereinbarkeit Familie und Beruf für Senior Manager
summary: "Herr Müller, Senior Manager mit psychisch belasteten Teenagern, sucht Unterstützung bei der Vereinbarkeit von Familie und Beruf. Es wird ein Maßnahmenplan mit Optionen wie Sabbatical oder Stundendekrease erstellt."
