title: Berufliche Belastung bei familiärer Krisensituation
summary: "Herr Müller, ein Senior Manager, sucht nach Lösungen für seine berufliche Präsenz während einer psychischen Krise seines Teenagers. Er erwägt Sabbatical, Stundendegression oder Projektdelegation."
