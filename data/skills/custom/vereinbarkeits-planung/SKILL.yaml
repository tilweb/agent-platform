id: vereinbarkeits-planung
name: Vereinbarkeits-Planung
version: "1.0"
description: "Analyse von Mitarbeitenden Situationen hinsichtlich Vereinbarkeit von Karriere und Familie und Erstellung von Vereinbarkeits-Plänen "
metadata:
  use_when: |
    - User fragt konkret nach einer Analyse einer Vereinbarkeits-Situation (Pflege, Kinder, Betreuung)
    - User schildert eine Situation, die Eindeutig als Vereinbarkeits-Situation erkennbar ist
  output_type: Strukturierte Analyse und Maßnahmenplan
