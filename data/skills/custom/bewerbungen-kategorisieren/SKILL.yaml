id: bewerbungen-kategorisieren
name: Bewerbungen kategorisieren
version: "1.0"
description: Analysiert E-Mails im Jobs-Postfach, kategorisiert sie als Bewerbung oder Sonstiges und vergibt automatisch Labels fuer Stelle, Sprachlevel und Standort

enabled: true

metadata:
  use_when: |
    - User moechte Bewerbungen im Postfach kategorisieren oder sortieren
    - User moechte Labels auf Bewerbungs-E-Mails setzen
    - User fragt nach neuen Bewerbungen oder unbearbeiteten Mails
    - User moechte das Jobs-Postfach aufraeumen
  estimated_effort: "1-3 Minuten pro E-Mail"
  output_type: "Bericht mit gesetzten Labels pro E-Mail"

allowed_tools:
  - gmail_search_emails
  - gmail_read_email
  - gmail_list_labels
  - gmail_set_labels
  - gmail_get_attachment

triggers:
  keywords:
    - bewerbungen kategorisieren
    - bewerbungen sortieren
    - postfach aufräumen
    - mails labeln
    - bewerbungen verarbeiten
    - bewerbungs-mails
  patterns:
    - "bewerbung(en)? (kategorisier|sortier|verarbeit|label)"
    - "(postfach|inbox|mails?) (aufräumen|sortieren|kategorisieren)"
    - "neue bewerbungen"

instructions: |
  ## Bewerbungen kategorisieren

  Du verarbeitest E-Mails aus dem Jobs-Postfach und vergibst automatisch die richtigen Labels.

  ### Schritt 1: Labels abrufen
  Rufe `gmail_list_labels` auf, um die aktuellen Label-IDs zu erhalten.
  Du brauchst die IDs fuer die Labels unter Bewerbung/, Sprachlevel/ und Standort/.

  ### Schritt 2: E-Mails finden
  Suche mit `gmail_search_emails` nach den zu verarbeitenden E-Mails.
  Typische Suchen:
  - `is:unread` — Ungelesene Mails
  - `newer_than:7d` — Mails der letzten 7 Tage
  - `label:inbox -label:Bewerbung` — Mails ohne Bewerbungs-Label
  Passe die Suche an die Anweisung des Users an.

  ### Schritt 3: Fuer jede E-Mail

  **3a) E-Mail lesen**
  Lies den vollstaendigen Inhalt mit `gmail_read_email`.

  **3b) Kategorie bestimmen (aus Mail-Body)**
  Analysiere den E-Mail-Text:
  - Ist es eine Bewerbung auf eine **konkrete Stelle**? → Bewerbung/[Stellenname]
  - Ist es eine **Initiativbewerbung** ohne Stellenbezug? → Bewerbung/Initiativ
  - Ist es **keine Bewerbung**? (Newsletter, Anfrage, Werbung) → Bewerbung/Sonstige Mails

  **3c) CV analysieren (nur bei echten Bewerbungen)**
  Wenn die E-Mail einen Anhang hat (PDF, DOCX):
  1. Lies den Anhang mit `gmail_get_attachment`
  2. Bestimme das **Deutsch-Sprachlevel**:
     - A = Grundkenntnisse (A1/A2, "Grundkenntnisse", "basic")
     - B = Gute Kenntnisse (B1/B2, "gute Kenntnisse", "intermediate", "gut")
     - C = Sehr gut bis Muttersprache (C1/C2, "verhandlungssicher", "fliessend", "Muttersprache", "native")
     - Hinweis: Ist der CV auf Deutsch verfasst und die Person hat einen deutschen Namen, ist C wahrscheinlich
  3. Bestimme den **Standort**:
     - DE = Adresse/Wohnort in Deutschland
     - EU = Adresse in EU-Land (nicht Deutschland)
     - World = Adresse ausserhalb der EU

  **3d) Labels setzen**
  Setze mit `gmail_set_labels` alle ermittelten Labels auf einmal:
  - Immer: ein Bewerbung/*-Label
  - Bei Bewerbungen mit CV: zusaetzlich Sprachlevel/* und Standort/*

  ### Schritt 4: Zusammenfassung
  Erstelle einen Bericht:
  - Welche E-Mails wurden verarbeitet
  - Welche Labels wurden jeweils gesetzt
  - Bei Bewerbungen: Kurzinfo zu Stelle, Sprachlevel, Standort mit Begruendung

workflow:
  steps:
    - id: labels
      action: tool
      tool: gmail_list_labels
      description: "Verfuegbare Labels und deren IDs abrufen"
    - id: search
      action: tool
      tool: gmail_search_emails
      description: "Zu verarbeitende E-Mails suchen"
    - id: process
      action: tool
      tool: gmail_read_email
      description: "Jede E-Mail lesen und kategorisieren"
    - id: cv
      action: tool
      tool: gmail_get_attachment
      description: "Bei Bewerbungen: CV-Anhang lesen und analysieren"
    - id: label
      action: tool
      tool: gmail_set_labels
      description: "Ermittelte Labels auf die E-Mail setzen"
    - id: report
      action: respond
      description: "Zusammenfassung der Kategorisierung"

output:
  format: markdown
