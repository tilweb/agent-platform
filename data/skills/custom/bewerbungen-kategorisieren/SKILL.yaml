id: bewerbungen-kategorisieren
name: Bewerbungen kategorisieren
version: "1.0"
description: Analysiert E-Mails im Jobs-Postfach, kategorisiert sie als Bewerbung oder Sonstiges und vergibt automatisch Labels fuer Stelle, Sprachlevel und Standort

enabled: true

metadata:
  use_when: |
    - User moechte Bewerbungen im Postfach kategorisieren oder sortieren
    - User moechte Labels auf Bewerbungs-E-Mails setzen
    - User fragt nach neuen Bewerbungen oder unbearbeiteten Mails
    - User moechte das Jobs-Postfach aufraeumen
  estimated_effort: "1-3 Minuten pro E-Mail"
  output_type: "Bericht mit gesetzten Labels pro E-Mail"

allowed_tools:
  - gmail_search_emails
  - gmail_read_email
  - gmail_list_labels
  - gmail_set_labels
  - gmail_get_attachment

triggers:
  keywords:
    - bewerbungen kategorisieren
    - bewerbungen sortieren
    - postfach aufräumen
    - mails labeln
    - bewerbungen verarbeiten
    - bewerbungs-mails
  patterns:
    - "bewerbung(en)? (kategorisier|sortier|verarbeit|label)"
    - "(postfach|inbox|mails?) (aufräumen|sortieren|kategorisieren)"
    - "neue bewerbungen"

instructions: |
  Dies ist ein Prozess-Skill. Der User-Prompt dient nur zum Starten — ignoriere den Wortlaut und fuehre immer exakt diesen Ablauf aus:

  ### Schritt 1: Labels abrufen
  `gmail_list_labels` — Label-IDs fuer Bewerbung/*, Sprachlevel/*, Standort/* und Sonstige Mails holen.

  ### Schritt 2: Unkategorisierte Mails finden
  `gmail_search_emails` mit query: `in:inbox has:nouserlabels` und max_results: 5.
  IMMER genau diese Query. NIEMALS den User-Prompt als Suchbegriff verwenden.

  ### Schritt 3: Pro E-Mail verarbeiten
  Fuer jede gefundene E-Mail:
  1. `gmail_read_email` — Inhalt lesen
  2. Entscheidungsbaum durchgehen (siehe Agent-Config) → Kategorie bestimmen
  3. Nur bei echten Bewerbungen: `gmail_get_attachment` → CV analysieren → Sprachlevel + Standort
  4. `gmail_set_labels` — Labels setzen (ein Bewerbung/*-Label ODER "Sonstige Mails", plus ggf. Sprachlevel + Standort)

  ### Schritt 4: Bericht im festen Format
  ```
  **[Anzahl] E-Mails verarbeitet:**

  1. **[Betreff]** → [Label] | [Sprachlevel] | [Standort]
     [Einzeiler Begruendung]

  2. **[Betreff]** → Sonstige Mails
     [Einzeiler Begruendung]
  ```
  Bei Sonstigen entfallen Sprachlevel/Standort. Keine Einleitung, nur die Liste.

workflow:
  steps:
    - id: labels
      action: tool
      tool: gmail_list_labels
      description: "Label-IDs abrufen"
    - id: search
      action: tool
      tool: gmail_search_emails
      params:
        query: "in:inbox has:nouserlabels"
        max_results: 5
      description: "Naechste 5 unkategorisierte E-Mails finden"
    - id: process
      action: tool
      tool: gmail_read_email
      description: "E-Mail lesen und kategorisieren"
    - id: cv
      action: tool
      tool: gmail_get_attachment
      description: "CV-Anhang analysieren (nur bei Bewerbungen)"
    - id: label
      action: tool
      tool: gmail_set_labels
      description: "Labels setzen"
    - id: report
      action: respond
      description: "Bericht im festen Format ausgeben"

output:
  format: markdown
