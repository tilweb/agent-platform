apps:
  vertragsmanagement:
    id: vertragsmanagement
    name: Vertragsmanagement
    description: Verträge hochladen, analysieren und verwalten
    icon: contract
    version: 1.0.0
    enabled: true
    routes:
      - path: /apps/vertragsmanagement
        component: ContractsPage
      - path: /apps/vertragsmanagement/upload
        component: UploadPage
      - path: /apps/vertragsmanagement/:id
        component: ContractDetail
  projektmanagement:
    id: projektmanagement
    name: Projektmanagement
    description: Projektaufträge erstellen, analysieren und verwalten
    icon: briefcase
    version: 1.0.0
    enabled: true
    routes:
      - path: /apps/projektmanagement
        component: ProjektePage
      - path: /apps/projektmanagement/neu
        component: WizardPage
      - path: /apps/projektmanagement/:id
        component: WizardPage
  lieferantenmanagement:
    id: lieferantenmanagement
    name: Lieferantenmanagement
    description: Lieferanten bewerten, Risiken steuern und Compliance sicherstellen
    icon: supplier
    version: 1.0.0
    enabled: true
    routes:
      - path: /apps/lieferantenmanagement
        component: LieferantenPage
      - path: /apps/lieferantenmanagement/:id
        component: SupplierDetailPage
  vsm:
    id: vsm
    name: Value Stream Mapping
    description: Wertströme erfassen, visualisieren und KI-gestützt analysieren
    icon: vsm
    version: 1.0.0
    enabled: true
    routes:
      - path: /apps/vsm
        component: VsmPage
      - path: /apps/vsm/:id
        component: VsmDetailPage
