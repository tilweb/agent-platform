id: mietvertrag
name: Mietvertrag
icon: building

fields:
  vertragspartner:
    vermieter:
      type: text
      required: true
      label: Vermieter
    mieter:
      type: text
      required: true
      label: Mieter

  objekt:
    adresse:
      type: text
      required: true
      label: Adresse
    flaeche_qm:
      type: number
      label: Fläche (m²)
    art:
      type: select
      label: Objektart
      options:
        - Wohnung
        - Haus
        - Gewerbe
        - Büro
        - Lager

  laufzeit:
    beginn:
      type: date
      required: true
      label: Mietbeginn
    ende:
      type: date
      label: Mietende
    kuendigungsfrist_monate:
      type: number
      required: true
      label: Kündigungsfrist (Monate)

  finanzen:
    kaltmiete_monatlich:
      type: number
      required: true
      label: Kaltmiete (monatlich)
    nebenkosten_monatlich:
      type: number
      label: Nebenkosten (monatlich)
    kaution:
      type: number
      label: Kaution

mapping:
  party_a: vertragspartner.vermieter
  party_b: vertragspartner.mieter
  start_date: laufzeit.beginn
  end_date: laufzeit.ende
  value: finanzen.kaltmiete_monatlich * 12
