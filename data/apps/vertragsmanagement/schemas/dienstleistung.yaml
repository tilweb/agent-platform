id: dienstleistung
name: Dienstleistungsvertrag
icon: briefcase

fields:
  vertragspartner:
    auftraggeber:
      type: text
      required: true
      label: Auftraggeber
    auftragnehmer:
      type: text
      required: true
      label: Auftragnehmer

  leistung:
    beschreibung:
      type: text
      required: true
      label: Leistungsbeschreibung
    umfang:
      type: text
      label: Leistungsumfang

  laufzeit:
    beginn:
      type: date
      required: true
      label: Vertragsbeginn
    ende:
      type: date
      label: Vertragsende
    kuendigungsfrist_tage:
      type: number
      label: Kündigungsfrist (Tage)

  sla:
    reaktionszeit_stunden:
      type: number
      label: Reaktionszeit (Stunden)
    verfuegbarkeit_prozent:
      type: number
      label: Verfügbarkeit (%)

  finanzen:
    verguetung_monatlich:
      type: number
      label: Monatliche Vergütung
    verguetung_jaehrlich:
      type: number
      label: Jährliche Vergütung
    zahlungsziel_tage:
      type: number
      label: Zahlungsziel (Tage)

mapping:
  party_a: vertragspartner.auftraggeber
  party_b: vertragspartner.auftragnehmer
  start_date: laufzeit.beginn
  end_date: laufzeit.ende
  value: finanzen.verguetung_jaehrlich

extraction:
  strategy: hybrid
  vision_fallback: true
  confidence_threshold: 0.7
