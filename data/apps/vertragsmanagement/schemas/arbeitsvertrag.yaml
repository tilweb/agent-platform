id: arbeitsvertrag
name: Arbeitsvertrag
icon: user

fields:
  vertragspartner:
    arbeitgeber:
      type: text
      required: true
      label: Arbeitgeber
    arbeitnehmer:
      type: text
      required: true
      label: Arbeitnehmer

  position:
    bezeichnung:
      type: text
      required: true
      label: Stellenbezeichnung
    abteilung:
      type: text
      label: Abteilung
    vorgesetzter:
      type: text
      label: Vorgesetzter

  laufzeit:
    beginn:
      type: date
      required: true
      label: Arbeitsbeginn
    ende:
      type: date
      label: Befristung bis
    probezeit_monate:
      type: number
      label: Probezeit (Monate)
    kuendigungsfrist_wochen:
      type: number
      label: Kündigungsfrist (Wochen)

  arbeitszeit:
    wochenstunden:
      type: number
      required: true
      label: Wochenstunden
    arbeitsort:
      type: text
      label: Arbeitsort
    homeoffice_tage:
      type: number
      label: Homeoffice (Tage/Woche)

  verguetung:
    bruttogehalt_monatlich:
      type: number
      required: true
      label: Bruttogehalt (monatlich)
    bonus_jaehrlich:
      type: number
      label: Bonus (jährlich)
    sonderzahlungen:
      type: text
      label: Sonderzahlungen

  urlaub:
    urlaubstage:
      type: number
      required: true
      label: Urlaubstage pro Jahr
    sonderurlaub:
      type: text
      label: Sonderurlaubsregelungen

mapping:
  party_a: vertragspartner.arbeitgeber
  party_b: vertragspartner.arbeitnehmer
  start_date: laufzeit.beginn
  end_date: laufzeit.ende
  value: verguetung.bruttogehalt_monatlich * 12
