id: mietvertrag
name: Mietvertrag
icon: building

fields:
  vertragspartner:
    vermieter:
      type: text
      required: true
      label: Vermieter
    mieter:
      type: text
      required: true
      label: Mieter

  objekt:
    adresse:
      type: text
      required: true
      label: Adresse
    flaeche_qm:
      type: number
      label: "Fläche (m²)"

  laufzeit:
    beginn:
      type: date
      required: true
      label: Vertragsbeginn
    ende:
      type: date
      label: Vertragsende
    kuendigungsfrist_monate:
      type: number
      required: true
      label: Kündigungsfrist (Monate)

  finanzen:
    kaltmiete_monatlich:
      type: number
      required: true
      label: Kaltmiete (monatlich)
    nebenkosten_monatlich:
      type: number
      label: Nebenkosten (monatlich)
    kaution:
      type: number
      label: Kaution

mapping:
  party_a: vertragspartner.vermieter
  party_b: vertragspartner.mieter
  start_date: laufzeit.beginn
  end_date: laufzeit.ende
  value: finanzen.kaltmiete_monatlich * 12

# Heavy-Extraction-Pipeline-Konfiguration (Phase D / P2).
# Mietvertraege koennen lang sein — section-aware Chunking gibt mehr Recall
# als ein einzelner Pass. priority-by-section bevorzugt Werte aus Sektionen,
# deren Heading zum Feld-Gruppen-Namen passt (z.B. "Finanzen", "Laufzeit").
extraction:
  strategy: long-text-chunked
  chunk_size_tokens: 8000
  chunk_overlap_tokens: 500
  section_aware: true
  merge_strategy: priority-by-section
  confidence_threshold: 0.7
