_lessons_learned: >-
  Wissensgebiet	SWOT	Beschreibung	Auswirkung	Empfehlung

  Wissensgebiet	SWOT	Beschreibung	Auswirkung	Empfehlung

  Integration	Stärke	Die klare Strukturierung der Arbeitspakete erleichterte die
  Integration der Projektinhalte.	Hohe Transparenz über Abhängigkeiten und
  Fortschritt.	Projektstrukturpläne früh und vollständig aufsetzen.

  Integration	Schwäche	Abhängigkeiten zwischen einzelnen Arbeitspaketen waren
  nicht sofort sichtbar.	Nachsteuerungsbedarf im Projektplan.	Abhängigkeiten
  explizit im Projektplan kennzeichnen.

  Inhalt & Umfang	Schwäche	Der Projektumfang wurde zu Beginn nur auf hoher Ebene
  beschrieben.	Rückfragen bei der Umsetzung einzelner Arbeitspakete.	Scope
  frühzeitig detaillieren und verbindlich abstimmen.

  Inhalt & Umfang	Chance	Die klare Trennung von Haupt- und Teilaufgaben
  verbesserte die Übersicht.	Bessere Priorisierung der Aufgaben.	Struktur
  konsequent beibehalten.

  Qualität	Stärke	Abnahmepunkte pro Arbeitspaket unterstützten die
  Qualitätssicherung.	Weniger Nacharbeit am Projektende.	Abnahmekriterien
  verbindlich definieren.

  Risiko	Risiko	Termin- und Ressourcenrisiken wurden erst im Projektverlauf
  konkret.	Erhöhter Steuerungsaufwand.	Risiken regelmäßig bewerten und
  nachhalten.

  Risiko	Chance	Die strukturierte Projektplanung erleichterte die Identifikation
  von Risiken.	Frühzeitige Gegenmaßnahmen möglich.	Risikolog dauerhaft im
  Projekt verankern.

  Termine	Risiko	Engpässe bei Ressourcen können zu Terminverschiebungen
  führen.	Gefährdung einzelner Meilensteine.	Frühzeitige Kapazitätsabstimmung
  mit der Linienorganisation.

  Termine	Stärke	Der Meilensteinplan schuf früh Klarheit über den zeitlichen
  Ablauf.	Gute Planbarkeit der Projektphasen.	Meilensteine regelmäßig überprüfen
  und aktualisieren.

  Organisation	Schwäche	Rollenabgrenzungen zwischen Projektleitung und
  Projektteam waren nicht immer eindeutig.	Doppelarbeit bei einzelnen
  Aufgaben.	Rollen und Verantwortlichkeiten klar dokumentieren.

  Organisation	Stärke	Das Projektteam arbeitete strukturiert entlang des
  Projektplans.	Stabiler Projektfortschritt.	Projektorganisation als Blaupause
  für Folgeprojekte nutzen.

  Stakeholder	Schwäche	Nicht alle Stakeholder waren zu Projektbeginn aktiv
  eingebunden.	Späterer Abstimmungsaufwand.	Stakeholderanalyse frühzeitig
  durchführen und regelmäßig aktualisieren.

  Stakeholder	Chance	Der Auftraggeber war regelmäßig in Entscheidungsprozesse
  eingebunden.	Schnelle Freigaben und klare Prioritäten.	Entscheidungsroutinen
  beibehalten.
_summary: >-
  Projekt- und Projektmanagementergebnisse: Ein vollständiger Projektauftrag,
  ein strukturierter Projektplan sowie ein abgestimmter Meilensteinplan wurden
  erstellt. Die Projektorganisation, Rollen und Kommunikationsformate sind
  definiert und dokumentiert.

  Time: Der Projektzeitplan ist erstellt und Meilensteine sind terminiert.
  Abhängigkeiten zwischen Arbeitspaketen sind berücksichtigt.

  Scope: Der Projektumfang umfasst die definierten Arbeitspakete gemäß
  Projektstrukturplan inklusive Planung, Umsetzung und Abschluss.

  Quality: Qualität wird über klare Anforderungen, abgestimmte Arbeitspakete und
  definierte Abnahmepunkte sichergestellt.

  Stakeholder: Zentrale Stakeholder wie Auftraggeber, Projektleitung und
  Projektteam sind identifiziert und in der Projektorganisation abgebildet.

  Risk: Risiken bestehen insbesondere in Abhängigkeiten zwischen Arbeitspaketen,
  Ressourcenverfügbarkeit und Terminverschiebungen.

  Organisation: Die Projektorganisation ist aufgebaut; Rollen und
  Verantwortlichkeiten sind festgelegt und den Arbeitspaketen zugeordnet.

  Integration: Die Integration der einzelnen Arbeitspakete erfolgt über den
  Projektstrukturplan und den abgestimmten Meilensteinplan.
