_lessons_learned: >-
  Wissensgebiet	SWOT	Beschreibung	Auswirkung	Empfehlung

  Organisation	Stärke	Crossfunktional	Hoche fachliche Abdeckung	

  Organisation	Schwäche	Knowledge Monopol (Video-Schnitt-Experte)	Die Vergabe
  von Key-Usern an andere Projekte ist nicht angesprochen worden durch PL und
  wurde schlecht kompensiert. Verzögerung von Projekt.	Es empfiehlt sich, im
  Vorfeld des Projekts für die kritischen Ressourcen auf dem kritischen Pfad
  Alternativen und Lösungsansätze zu identifizieren und zu organisieren.

  Organisation	Schwäche	Zusammenarbeit in formellen Team-Meetings
  schwerig	Vertrauensverlust, Motivationsverlust	Es gilt, in Besprechungen vorab
  die wichtigsten Werte zu definieren und deren Einhaltung zu gewährleisten. Es
  ist wichtig, eine positive Meeting-Kultur zu fördern.

  Organisation	Schwäche	Fehlendes Projektmanagement Know how	Lücken im
  Risikomanagement und Stakeholdermanagement	Strukturiertes vorgehen mit
  Toolbox 

  Risiko	Schwäche	Risikomanagement von Anfang an	Risiken werden jedoch
  frühzeitig nicht vollständig identifiziert.	Auftraggeber mit einbinden

  Risiko 	Chance	Verbindlichkeit bei den Ressourcen schaffen	Planungssicherheit
  für das Projektteam	Plan-Ist-Forecast regelmäßig kommunizieren,
  Projekt-Aktivitäten im Vorfeld planen und kommunizieren.

  Qualität	Risiko	Anforderungsanalyse		Die Kundenanforderungen an die gewünschte
  Qualität der Projekt-Deliverables können früher und ausführlicher definiert
  werden. Die Kunden können tiefer in die Pilot-Phase einbezogen werden, um
  schneller, früher und mehr Feedback zu bekommen. 

  Qualität	Stärke	Definieren von Prototyp und MVP	Erfolgreiche Produktion von
  Kursmaterialien und gewünschte Qualitätskriterien werden erreicht.	

  Kosten	Schwäche	Die Risikokosten wurden im Projektauftrag nicht
  betrachtet	Durch das fehlende Budget gab es keinen Handlungsspielraum für die
  Umsetzung von Maßnahmen zur Risikominimierung	Im Projektauftrag immer das
  Risikobudget verankern

  Kommunikation	Schwäche	Regelmäßige Kommunikation mit den Stakeholdern
  (Auftraggeber, Fachbereiche etc.) fördert die Zusammenarbeit	Wir hatten
  manchmal eine fehlende Kommunikation in Team-Meetings, was zu
  Vertrauensverlust ins Team und einer schwierigen Zusammenarbeit führte.	Es
  gilt, in Besprechungen vorab die wichtigsten Werte zu definieren und deren
  Einhaltung zu gewährleisten. Es ist wichtig, eine positive Meeting-Kultur zu
  fördern.

  Termine	Stärke	Meeting- und Berichtskaskade, von Anfang an geplant, hat sehr
  gut funktioniert 	Jeder Projektbeteiligte und Stakeholder wusste, wann er was
  an Informationen erwarten konnte	Meeting- und Berichtskaskade sollte schon im
  Projektauftrag verankert werden

  Inhalt & Umfang	Stärke	Sehr gute fachliche Expertise im Projektteam	Die
  Entwicklung der Kurs-Materialien entspricht den Anforderungen der
  Anwender	Einbeziehung der späteren Kurs-Teilnehmern/ Kunden von Anfang an, um
  deren Anforderungen besser umzusetzen

  Qualität	Stärke	Die Erfolgskriterien der Projektziele zu den Abnahmenkriterien
  zu machen war eine sehr gute Entscheidung	Die späteren Anwender waren von
  Anfang an eingebunden und haben das Projektteam sehr gut
  unterstützt	Erfolgskriterien zu Abnahmekriterien zu machen hilft bei der
  Qualitätssicheung sehr

  Qualität	Risiko	Ohne Erfolgskriterien werden die Qualitätsanforderungen nicht
  transparent	Ohne Abnahmekriterien kann man schnell an den Anforderungen der
  Anwender vorbei entwickeln	Einbezieheung der späteren Kunde schon bei der
  Erstellung des Projektauftrages
_summary: >+
  Projekt- und Projektmanagementergebnisse

  Time: Videos und Unterlagen werden nicht in zeitlichem Rahmen umgesetzt. Es
  sind 2 Monate Verzögerung aufgetreten, weil die Key-Ressourcen (Techn.
  Videoschneiden) auf anderen Projekten eingesetzt worden und weil der Aufwand
  bei Videoschneiden-Aktivitäten zu positiv eingeschätzt ist. 

  Scope: Scope: Die neuen deutschen MC-Videos und die dazugehörenden
  Kursmaterialien sind produziert worden. Die ersten 4 englischen Videos für
  Pre-Sales-Zwecke sind nicht produziert worden, weil die Auftraggeber diese
  nicht nützlich fand.

  Quality: Die Qualitätsanforderungen an die Videos und dazugehörenden
  Kursmaterialien wurden erfüllt und die Stakeholder sind sehr zufrieden mit den
  neuen MC-Kursmaterialien.

  Budget: Aufwand und Kosten mussten im Projektverlauf 10% erhöht werden, weil
  die Video-Schnitt-Aktivitäten zu kurz eingeplant worden waren.

  Beschaffung: Es wurden einige kleine Dinge gekauft, um die Qualität von
  Video-Bild und Video-Ton zu verbessern. Dieser Kaufprozess verlief
  reibungslos. Das Projekt wurde weiterhin ausschließlich mit internen
  Mitarbeitern realisiert. 

  Stakeholder: Die Stakeholder wurden nur unzureichend betrachtet. Die
  Auftraggeber und RUHR PM-Mitarbeiter wurden nicht genug einbezogen. Die
  Stakeholder sind nicht genug einbezogen beim Feiern des Erreichens von
  Projekt-Meilensteinen.

  Risk: Risiken wurden nur unzureichend betrachtet. Der zeitliche Abzug einer
  Key-Ressource hat Verzögerung verursacht und da war kein Risikomanagement-Plan
  für einen Ersatz. Das Desinteresse beim Auftraggeber an der Produktion von
  englischen Videos ist nicht als Risiko betrachtet worden.

  Organisation: Die Projektorganisation (Auftraggeber, Lenkungskreis,
  Projektleiter, Akademie-Leiterin, Video-Moderatoren und
  Video-Produktions-Team) war einwandfrei aufgestellt und hat gut funktioniert.

  Kommunikation: Die Kommunikation innerhalb des Projektes war schwierig bei den
  formellen 2‑wöchentlichen Team-Meetings. Die Kommunikation innerhalb des Teams
  bei den Video- Produktionsmomenten war gut. Die Statusberichte PL
  (Projektleiter) – 14-tägig – und Statusberichte AG (Auftraggeber) –  14-tägig
  – wurden durchgeführt und dokumentiert.

  Integration: Die Zusammenführung der Ergebnisse aus den Wissensgebieten hat
  sehr gut funktioniert. Der Projektfortschritt und die Prognose waren
  transparent und nachvollziehbar.

