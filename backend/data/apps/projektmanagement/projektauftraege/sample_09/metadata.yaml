goals: >-
  1. Qualitätsverbesserung. Das erste Hauptziel des Projekts ist, den
  Teilnehmenden der Masterclass neue Projektmanagement-Fähigkeiten durch
  verbesserte deutsche Videos erfolgreicher und effektiver zu vermitteln.

  2. Pre-Sales Unterstützung. Das zweite Ziel dieses Projekts ist es, vier
  englische Masterclass-Videos für Pre-Sales-Zwecke zu erstellen, um dadurch
  englischen Videos von guter Qualität potenziellen Kunden zu zeigen.  

  SMART Erfolgskriterien sind: 

  1. Wir wollen die Qualität der deutschen Videos steigern. Wir benötigen dafür:

  1.1 Qualitatives MC PM 4.0 Video-Präparation und Video-Aufnahme-Checkliste

  1.2. Video-Content-Skript für jedes neue Video mit neuen didaktischen Grafiken
  und Bildern im PPT-Format.

  1.3. Deutsche Videos (32) neu produziert und im Memberspot, deutsche MC PM 4.0
  hinterlegt.

  1.4  Neue Video Aufnahme-Technik und Postproduktion-Technik


  2. Das 2. Hauptziel des Projekts ist die MC PM 4.0 Pre-Sales Aktivitäten zu
  unterstützen. Wir benötigen dafür:

  2.1. Englische Videos (4) werden neu produziert (wie bei deutschen Videos) und
  im englischen MC PM 4.0 Memberspot hinterlegt.


  3. Um das oben stehende zu schaffen, brauchen wir ein gut funktionierendes
  Projektteam, wo motivierend und konstruktiv zusammengearbeitet wird. 

  3.1 Bei einer Änderung der Kapazität können wir uns gegenseitig unterstützen.
