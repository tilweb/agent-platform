_lessons_learned: >-
  Wissensgebiet	SWOT	Beschreibung	Auswirkung	Empfehlung

  Integration	Schwäche	Abhängigkeiten zwischen einzelnen Arbeitspaketen waren
  nicht sofort sichtbar.	Nachsteuerungsbedarf im Projektplan. Keine
  Prozessdurchgänigkeit für den Tests gegeben	Abhängigkeiten explizit im
  Projektplan kennzeichnen, Zuständigkeiten und Rollen klären, Staffelstab
  Übergabe definieren

  Inhalt & Umfang	Schwäche	Der Projektumfang wurde zu Beginn nur auf hoher Ebene
  beschrieben, konkrete Anforderungen waren nicht dokumentiert	Planung (Zeit und
  Aufwand) und Ressourcensteuerung auf Basis der vorhandenen Inhalte nicht
  möglich.	Scope frühzeitig detaillieren und verbindlich abstimmen. Nachholen
  smarte Zielformulierung und Definition von IN/ OUT of Scope

  Inhalt & Umfang	Chance	Ein vollständiges und aktualisiertes Gesamtbild der
  Systemlandschaft kann für den weiter Betrieb der Systeme in der Cloud weiter
  benutzt werden.	Überblick über gesamte Systemlandschaft und
  Abhänigkeiten	Struktur konsequent aktualisieren und beibehalten.

  Qualität	Schwäche	Es war schwierig, ein Gesamtbild der Systemlandschaft zu
  erstellen, da die IT-Abteilung und Fachbereichen nicht genug Informationen
  liefern könnten	Abhangigkeiten unklar, Kein vollstandige Uberblick über
  Systeme und damit abgebildete Prozesse, Keine klare Zustandigkeit	Workshops
  mit den beteiligten Gesellschaften und Abstimmung mit den Fachbereichen,
  Regelmäßiger Abgleich des Gesamtbildes in Verlauf der Testaktivitäten

  Qualität	Schwäche	Im Laufe des Projekts sahen wir uns mehrfach mit der
  Bewältigung von Schwierigkeiten hinsichtlich der Freischaltung von Firewalls
  sowie mit Berechtigungsproblematiken konfrontiert.	Testdurchführung nicht
  vollständig möglich	Firewall-Freigabe und Spezialberechtigungen explizit im
  Projektplan kennzeichnen, Zuständigkeiten und Rollen klären, Testerkenntnisse
  aus der Testumgebung auf das Produktivszenario übertragen: Aus Fehler lernen
  und Firewall-Freischaltungen oder Berechtigungen direkt in das Thema
  mitnehmen.

  Qualität	Stärke	Cutoverplanung und Migrations-Wochenende-Einteilung (wer macht
  was und wann) plus "Business Handover" klar kommuniziert und organisiert	Klare
  Abhängikeiten und Zustandigkeiten. Zentrale Koordination der Aktivitäten in
  Verlauf der Produktivwochenenden	Namensscharfe Liste mit Beteiligten und
  Kontaktdaten. Konkrete Uhrzeiten und Risikomanagement Vorgaben
  (Defectmanagement, Point of No-Return, Rollbackscenarios)

  Qualität	Stärke	Test- und Qualitätsmanager für den Testkatalog sind anwesend
  und unterstützen den Prozess. Sie können aud Grund ihres Know-Hows und bereits
  verfügbare Testfälle kürzfristig einen stabilen Testkatalog
  erarbeiten	Verbindliche und sofort umsetzbare Testfallkatalog
  vorhanden	Bedingt durch mehrere Migrations-Wellen wird eine vollumfängliche
  Vorlage für dem Testkatalog erstellt je nach beteiligten Systemen pro Welle,
  können die Testfälle mehrfach verwendet bzw. dupliziert werden.

  Risiko	Risiko	Termin- und Ressourcenrisiken wurden erst im Projektverlauf,
  bedingt durch mehrere Meilenstein-Verschiebungen oder unklare Anforderungen
  konkret	Erhöhter Abstimmungs und  Steuerungsaufwand.Wiederholte
  Ressourcenabfrage beim Betriebsrat notwendig	Risiken mit dem Planung zu Begin
  bewerten und dann regelmäßig aktualiseren. Gegenmaßnahmen aufsetzen und
  aktuellen Stand nachhalten.

  Risiko	Schwäche	Veränderungen im Testsystem, die durch andere IT-Projekte
  verursacht werden, führen zu Prozessänderungen im Projekt. Die Abhängigkeiten
  mit anderen Projekten oder mit dem Business werden nicht oder nicht
  ausreichend berücksichtigt, was zu Verzögerungen bei Projekten führt. Zum
  Beispiel: Kolision Quartalsabschluss versus IT-Migrationswochenende. Oder
  Kollisionen mit Migrationswochenenden oder Go-Live-Wochenenden anderer
  IT-Projekte.	Abhänigkeiten durch fehlende Abstimmung und wechselseitige
  Behinderung beim Testen	Übergreifende Abstimmung der Bedurfnissen und
  Prioritäten der jeweiligen Projekten

  Risiko	Schwäche	Der Verlust von Wissensträgern stellte ein regelmäßiges
  Problem dar (Know-How nicht mehr vorhanden oder Wissensträger scheiden während
  der Projekt aus).	Gefährdung Projekt-Ergebnissen	Dokumentation und
  Wissenmanagement viel stärker im Vordergrund setzen. Vertetungsmanagement
  vereinbaren

  Termine	Risiko	Engpässe bei Ressourcen können zu Terminverschiebungen
  führen.	Gefährdung einzelner Meilensteine.	Frühzeitige Kapazitätsabstimmung
  mit der Linienorganisation.

  Termine	Schwäche	Auf Grund von unvollständig definierten Anforderungen müsste
  die Projektplanung und Roadmap immer wieder neu definiert werden	Schlechte
  Planbarkeit der Projektphasen und Ressourcen-Einsetzen	Die Anforderungsanalyse
  anpassen und ergänzen und den Terminen mit den Beteiligten abstimmen.

  Organisation	Risiko	Projektmitglieder, Key-Usern und Tester sind nicht
  verfügbar oder knapp.	Gefährdung einzelner Meilensteine.	

  Stakeholder	Schwäche	Nicht alle Stakeholder waren zu Projektbeginn aktiv
  eingebunden.	Themen laufen aus Unwissenheit entgegen der Projektziele.
  Ressourcen können nicht eingestellt werden weil sie schön anders eingeplannt
  sind. Unsicherheit und unterschiedliche Informationen verbreiten sich nach dem
  "Stille Post" Prinzip.Zusätzliche Abstimmungsaufwand.	Stakeholderanalyse
  frühzeitig und vollständig durchführen und regelmäßig aktualisieren.

  Kommunikation	Stärke	Das Projektteam trifft sich täglich kurz (Daily), um den
  Status und den Fortschritt zu besprechen.	Transparenz für alle Gesellschaften
  und Testingbeteiligten, schnelle und transparente Kommunikation für alle
  Beteiligte, immer aktueller Stand des Fortschritts bekannt	Nutzung eines
  gemeinsamen Teams-Kanals und Termins für die Abstimmung. Klare Regelungen zur
  Testdurchführung, revisionssicheren Dokumentation und Umgang mit Fehlern

  Kommunikation	Stärke	Das Planen von drei täglichen Treffen während der
  Migration-Wochenenden mit Projektteam, Tester und Key-Usern	gemeinsames
  Abstimmen und Planen der Migrationsszenarien.  Analyse bzw. Umgang mit Fehlern
  und Koordination der Aufgaben zwischen IT und Fachbereich in einem
  Termin	Board mit To Do Themen und Verantwortlichkeiten, regelmäßige
  Kurzprotokolle für Lenkungskreis, Hohe Transparenz des Fortschritts bzw.
  Adressierung von Entscheidungsbedarfen

  Kommunikation	Stärke	Trainingstagen und Schulungen wurden von Anfang an
  geplant (Zbs. Was ist ein Epic und was ist eine Story) für das Projektteam,
  Tester und Key-usern	einheitliche Regeln und Know Hoiw für alle
  Testingbeteiligten, Dokumentation des Vorgehens und Anleitung zur
  Testdurchführung bzw. revisionssicheren Dokumentation der Ergebnisse mit allen
  abgestimmt.	Teams Kanal zur Dokumentation des Vorgehens, Abstimmung des
  Fehleraufkommens und dem Umgang damit, schnelle Kommunikation untereinander

  Kommunikation	Stärke	Die Ergebnisse von Tests werden in der "14-Täglichen
  Status-Meetings" übersichtlich für IT und Geschäftsbereich dargestellt und
  mitgeteilt.	Transparenz über den Fortschritt, jederzeit aktuelle Informationen
  für alle Beteiligten	Statusberichte im Termin vorstellen, Versand im Nachgang
  an alle Beteiligten. Aufnahme von Fragen innerhalb des Termins, Beantwortung
  direkt aus dem Projektteam oder Klärung und Dokumentation der Antworten in
  einer zentral wachsenden FAQ-Übersicht
_summary: >
  Projekt- und Projektmanagementergebnisse: Bis Ende Q1/2025 müssen alle
  alt-Applikationen in eine Cloud migriert werden. Hintergrund ist die geplante
  Schließung des derzeit noch genutzten Rechenzentrums. Daher müssen die
  betroffenen Applikationen fachlich getestet werden, nachdem sie in die Cloud
  migriert wurden, um sicherzustellen das die Funktionsfähigkeit der Prozesse
  auch weiterhin gegeben ist.

  Time: Migrationstermine (Ende März/Anfang April) werden verschoben, da
  Testsysteme nicht in benötigt stabiler Form bereitgestellt werden können.
  Target End verschoben aufgrund der Terminverschiebungen,Testzeitraum und Prod
  Wochenenden. Target Date Verschiebung auf Ende April.Weitere Verzögerung durch
  Schwierigkeiten bei der Bereitstellung der Testumgebungen, dadurch keine
  Testfreigaben und Testdurchführung möglich. Punktuelle Tests erfolgen für
  Prozesse die keine Schnittstellen zu anderen Systemen habe

  Scope: Bis Ende Q1/2025 müssen alle alt-Applikationen in eine Cloud migriert
  werden

  Quality: Das vorhandene Testkonzept muss umfassend angepasst werden, aufgrund
  abweichender Testprozesse (Vorgehen), ungewisser Termine und unerwarterter
  Beschränkungen (z. B. bei den zu testenden Systemen und eingesetzten
  Werkzeugen).

  Sowohl Prod als auch Test-Fehler in Bearbeitung, ab 31.07. Fokus auf Prod bzw.
  Vorbereitungen zur Prod Migration, div. Fehler aus Test sind bis nach der
  Migration zurückgestellt. Diese sollen danach jedoch behoben werden damit die
  Testsysteme auf dem aktuellen, produktivnahen Stand (inkl. Anbindung
  Umsysteme) sind, um die Stabilität und Weiterentwicklung der Systeme für die
  geplante Einsatzdauer zu gewährleisten. Ein Defect Management Prozess ist
  etabliert und dokumentiert. Fehler aus einzelnen Tests von Anwendungen ohne
  Schnittstellen zu anderen Systemen sind durchlaufend bearbeitet worden.

  Stakeholder: Zentrale Stakeholder wie Auftraggeber, Projektleitung,
  Projektteam, Key-usern, Tester, Ansprechpartner beim IT und beim Business sind
  identifiziert und in der Projektorganisation abgebildet.

  Risk: Besondere Risiken bestehen insbesondere hinsichtlich der Verfügbarkeit
  von Ansprechpartnern und relevantem Fachwissen sowie in der Abhängigkeit von
  anderen Projekten, welche einen Einfluss auf die betroffenen Prozesse und die
  Systemlandschaft ausüben. Die Konfiguration und die Einstellungen von
  Systemberechtigungen sowie Schwierigkeiten mit der Firewalls bergen
  zusätzliche Risiken.

  Organisation: Die Projektorganisation ist aufgebaut; Rollen und
  Verantwortlichkeiten sind festgelegt und den Arbeitspaketen zugeordnet.
  Projekt-Schulungen sind organisiert worden für Projektteam, Tester und
  Key-usern.

  Integration: Die Integration der einzelnen Arbeitspakete erfolgt über den
  Projektstrukturplan und den abgestimmten Meilensteinplan.
