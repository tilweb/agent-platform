id: sample_11
name: Cloud Migration
project_type: infrastructure
start_date: 2024-09-01
end_date: 2025-09-30
projektleiter: Gudrun Kelp
auftraggeber: Katrin Becker
description: "Importiert aus: 11 Cloud Migration GKE"
goals: "Ziel: Migration aller im Business Prozess genutzten Systeme die im
  Rechenzentrum gehostet werden in eine Azure-Cloud Umgebung. In Scope für unser
  Teilprojekt sind:"
criteria:
  - Testing und Quality Management.
  - Identifizierung aller genutzter Systeme inkl. Schnittstellen.
  - In Bild bringen von Abhängigkeiten und Ansprechpartnern entlang der Customer
    Journey.
  - >-
    Ableiten und Priorisieren erforderlicher Testfälle zur Sicherstellung der
    Datenverfügbarkeit und Prozessfunktionalität (-stabilität) in der Cloud.

    Testdurchführung in Wellen:  Testsysteme (3 Wellen) , Produktivsysteme 5
    WellenUnseren Projekterfolg messen wir an den folgenden Kriterien:

    - Bis Ende September 2024 sind 100 % aller im Business-Prozess genutzten
    Systeme, inklusive aller technischen und fachlichen Schnittstellen,
    identifiziert, dokumentiert und durch die jeweiligen Fach- und IT-Owner
    freigegeben. Abgleich des Systeemarchitektur-Schaubilds mit den aktuellen
    Ist-Zustand inklusive Abhängigkeiten und Verantwortlichkeiten für alle
    identifizierten Systeme.

    -Vollständige Testabdeckung der kritischen Geschäftsprozesse,
    Risikoorientiertes Testen

    zu Sicherstellung der Prozessfunktionalität und -stabilität durch
    priorisierte Testfälle, Freigabe durch Business-Verantwortlicher.

    - Eine erfolgreiche Durchführung der Migration bis Ende März 2025

    - Behebung kritischer Fehler vor Produktivmigration und bis Ende September
    2025 ein Begleitung des Prozesses innerhalb ein 4-wöchentlichen Hypercare
    Phase (Defectmanagement nach Produktivsetzung).
scope: Die Hauptanforderung besteht darin, sämtliche angezeigten IT-Systeme in
  die Cloud zu migrieren und sicherzustellen, dass alle Abhänggkeiten
  gewährleistet werden. Schnittstellen, Berechtigungen und Arbeitsprozesse
  funktionieren weiterhin wie vorgesehen. Wir werden keine Data-Qualitätsziele
  in das Projekt einbeziehen und nehmen keine Rücksicht auf den Inhalt oder die
  Qualität von bestimmten Daten.
