goals: >-
  WHY – Warum?

  Die Stadtwerke Zehdenick benötigen Transparenz und Struktur im
  Projektmanagement, da aktuell Übersicht, Standards, klare Aufgabenverteilung
  und Dokumentation fehlen.


  HOW – Wie?

  Durch die gemeinsame Entwicklung eines digitalen Prototyps auf Basis von MS
  Teams und Excel Pivot zur Standardisierung von Prozessen und Berichten.


  WHAT – Was?

  Ein funktionsfähiger Prototyp für das Projektportfoliomanagement inklusive
  Vorlagen, Ablagestrukturen, Reporting und Schulung der Mitarbeitenden.
