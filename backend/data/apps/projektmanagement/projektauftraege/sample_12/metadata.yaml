goals: >-
  Ziele

  WHY – Warum?

  Erhöhung der Netzwerksicherheit und Transparenz durch standardisierte
  VLAN-Segmentierung und NAC

  Reduktion von Sicherheitsrisiken und Komplexität im globalen Netzwerkbetrieb


  HOW – Wie?

  Einführung globaler VLAN- und NAC-Standards

  Enge Abstimmung mit Standorten und Security

  Schrittweise Umsetzung mit klarer Governance und Dokumentation


  WHAT – Was?

  Definition und Implementierung standardisierter VLANs

  Zuweisung von Hosts zu VLANs inkl. Regeln

  Steuerung des Inter-VLAN-Traffics über Firewalls

  Erstellung von Betriebs-, Schulungs- und Übergabedokumentation Spezifisch

  Globale VLAN- und NAC-Standards definiert und dokumentiert

  Host-Zuordnung und Zugriffsregeln verbindlich festgelegt


  Erfolgskriterien

  Spezifisch

  Globale VLAN- und NAC-Standards definiert und dokumentiert

  Host-Zuordnung und Zugriffsregeln verbindlich festgelegt


  Messbar

  ≥95 % der bekannten Hosts eindeutig VLAN-zugeordnet

  100 % der definierten VLANs mit aktiven Firewall-Regeln


  Attraktiv

  Erhöhte Netzwerksicherheit bei reduziertem Betriebsaufwand

  Klare Transparenz über Netzwerkzugriffe und Host-Zuordnung


  Realistisch

  Infrastruktur und personelle Ressourcen verfügbar

  Lokale IT-Einheiten eingebunden und geschult


  Terminiert

  Phase-2-Ziele bis Ende 2024 erreicht

  Dokumentation und Betrieb übergeben
