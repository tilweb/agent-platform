_lessons_learned: >-
  Wissensgebiet	SWOT	Beschreibung	Auswirkung	Empfehlung

  Integration	Chance	Optimierung/Aktualisierung Website & Blog	Mehr Nutzen für
  Zielgruppen	Kontinuierliche Weiterentwicklung

  Inhalt & Umfang	Chance	Inhalte überarbeitet und strukturiert	Verbesserte
  Nutzerführung	Content-Prozesse standardisieren

  Inhalt & Umfang	Schwäche	extern: unzuverlässige und unvollständige Lieferung
  Dienstleiter, bei jedem Meilensteinabschluss unter Erwartungen
  geblieben	Verzögerung im Projekt, Unzufriedenheit im Projektteam	Verbindliche
  Service Level / Eskalationsmechanismus / klare Abnahme-Kriterien

  Inhalt & Umfang	Schwäche	intern: zu späte Lieferung Text und Websiteinhalte
  (Bilder, Layouts etc) , Nichtnutzung der Zeiten, wenn Dienstleister
  programmiert	längere Projektdauer	Verbindliche Content-Deadlines + interne
  Priorisierung + Verantwortlichkeiten festlegen

  Qualität	Stärke	SEO-Optimierung & Textqualität	Höhere Sichtbarkeit,
  professioneller Eindruck	SEO & Qualitätsstandards fortsetzen

  Qualität	Schwäche	Zu wenig Zielorientierung Übergabe Linie, Feedback einholen
  der Kunden und Gesamtnutzung Website	Website wird nicht optimal genutzt,
  Potenzial bleibt liegen	Erfolgsmetriken definieren (KPIs) + User-Feedback
  kontinuierlich einholen & umsetzen

  Kosten	Stärke	Budget eingehalten bzw. unter Budget geblieben	Ressourcen
  effizient eingesetzt	Kostencontrolling beibehalten

  Kommunikation	Stärke	Wöchentliche Jour Fixe, enge Abstimmung	Transparente
  Zusammenarbeit	Format beibehalten

  Risiko	Risiko	Abhängigkeit von Einzelpersonen Programmierung und
  Design	Wissensmonopol / Engpass	Dokumentation & Wissen verteilen

  Risiko	Risiko	Tests vor Go-Live unvollständig	Nacharbeiten,
  Verzögerungen	Testprozesse/Checkliste stärken

  Risiko	Risiko	Traffic noch nicht wie geplant	Projektwirkung
  gefährdet	Zielgruppenanalyse & Marketingmaßnahmen

  Termine	Schwäche	Zeitplanung schlecht / zu ambitioniert, keine Pfuffer,
  perfekte Ausrede	Projektverzug, hoher Druck	Realistische Planung + Puffer

  Organisation	Stärke	Nutzung Toolbox, nutzbar als Checkliste und zur Prüfung,
  sehr geeignet für Bericht an Auftraggeber	Strukturierte
  Projektsteuerung	Toolbox als Standard nutzen

  Organisation	Stärke	Gute Erreichbarkeit	Schnelle Entscheidungen	Beibehalten

  Organisation	Chance	Technisches Know-how aufgebaut	Interne Kompetenz
  gestärkt	Wissen dokumentieren & weitergeben
_summary: >+
  Projekt- und Projektmanagementergebnisse

  Time / Termine Projekt hat sich verzögert. Ursache: ambitionierte Planung,
  fehlende Puffer, interne und externe Lieferverzögerungen.

  Scope / Inhalt & Umfang Inhalte erfolgreich überarbeitet und strukturiert.
  Aber: Lieferqualität und -termine von Dienstleister und internen Content-Teams
  unzuverlässig → Meilensteine mehrfach verfehlt.

  Quality / Qualität SEO & Textqualität stark verbessert. Nutzungserfolg der
  neuen Website jedoch noch unzureichend, da Nutzerfeedback nicht systematisch
  eingeholt wird.

  Cost / Kosten Budget eingehalten bzw. unter Budget → effiziente
  Ressourcennutzung.

  Procurement / Beschaffung Dienstleister leisteten unvollständig und verspätet
  → Eskalation und Vertragsklarheit hätten früher greifen müssen.

  Stakeholder / Kommunikation Interne Kommunikation gut (Jour Fixe, schnelle
  Entscheidungen). Stakeholder-Input wie Nutzerfeedback und Linienorganisation
  jedoch zu spät berücksichtigt.

  Risk / Risiken Risiken unterschätzt: Einzelpersonen-Abhängigkeit, fehlende
  Testreife vor Go-Live → Nacharbeiten, Engpässe, potenzielle
  Sichtbarkeitsverluste.

  Organisation / Governance Sehr gut: Toolbox + klare Struktur ermöglichten
  effiziente Steuerung und Berichterstattung. Internes Know-how wurde aufgebaut.

  Integration Ergebniszusammenführung erfolgreich: Website ist funktionsfähig
  mit spürbarem Mehrwert. Fortlaufende Optimierung notwendig.

