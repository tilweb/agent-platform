goals: >-
  Why (Warum/Wofür): Wir möchten als führender Ansprechpartner für
  professionelles Projektmanagement wahrgenommen werden und Unternehmen
  befähigen, moderne Arbeitsweisen und professionelles Projektmanagement
  erfolgreich umzusetzen.

  How (Wie): Wir schaffen eine nutzerzentrierte, visuell ansprechende und
  technisch moderne Plattform, die unsere Expertise widerspiegelt, Vertrauen
  aufbaut und einen klaren Mehrwert für unsere Zielgruppe bietet. Durch klare
  Botschaften, relevante Inhalte und einfache Kontaktmöglichkeiten fördern wir
  den Dialog mit unseren Kunden und Interessenten.

  What (Was): Der Relaunch unserer Website bietet eine intuitive
  Nutzererfahrung, optimierte Inhalte für alle Endgeräte und zielgerichtete
  Funktionen wie Kontaktformulare, Blogartikel und Services, die unsere Mission
  und unser Know-how im Projektmanagement sichtbar machen.
