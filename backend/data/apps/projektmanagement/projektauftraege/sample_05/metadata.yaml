  - Erfolgskriterium 1
scope: Es gibt die gesetzliche Vorgabe, die Areitszeiten von Mitarbeitenden zu
  erfassen. Wir möchten dafür eine moderne Cloudlösung einführen, damit Remote
  und Büroarbeitszeiten gleichermaßen erfasst werden können. Die
  Erfassungsgeräte befinden sich bei den Mitarbeitenden und eine einfach
  Handhabung ist sichergestellt. Das System ist für die Mitarbeitenden atrraktiv
  und daher nutzen sie es verlässlich,wobei keine zusätzliche Belastung
  entsteht.
