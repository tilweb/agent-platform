description: "Importiert aus: 01 DZE24 MGT"
goals: "Das Ziel der Zeiterfassung ist es, die technische Basis für die tägliche
  Arbeitszeiterfassung aller MA zu schaffen. Dazu wollen wir das MVP testen und
  kontinuierlich ausbauen. Unseren Projekterfolg messen wir an den folgenden
  Kriterien:"
criteria:
  - Die Zeiterfassung ist für Arbeitgeber und Arbeitnehmer zugänglich.
  - Die Arbeitszeit wird am Ende jeden Tages erfasst und dauert nicht länger als
    eine Minute.
  - Unsere Mitarbeitenden finden das System attraktiv und leicht zu nutzen.
  - Das System ist mit verschiedenen Geräten von jedem Arbeitsort nutzbar.
  - Es gelingt uns, unseren Zeitplan einzuhalten.
scope: Es gibt die gesetzliche Vorgabe, die Areitszeiten von Mitarbeitenden zu
  erfassen. Wir möchten dafür eine moderne Cloudlösung einführen, damit Remote
  und Büroarbeitszeiten gleichermaßen erfasst werden können. Die
  Erfassungsgeräte befinden sich bei den Mitarbeitenden und eine einfach
  Handhabung ist sichergestellt. Das System ist für die Mitarbeitenden atrraktiv
  und daher nutzen sie es verlässlich,wobei keine zusätzliche Belastung
  entsteht.
