_lessons_learned: >-
  Wissensgebiet	SWOT	Beschreibung	Auswirkung	Empfehlung

  Integration	Stärke	Zusammenführung der Informationen war sehr
  gut	Statusberichte waren dadurch sehr aussagekräftig	Wichtiges Hilfsmittel für
  die Projektsteuerung und die Kommunikation

  Integration	Schwäche	Nicht alle Wissensgebiete wurden integriert	Weniger
  Transparenz bei den Risiken und Stakeholdern	Unbedingt alle Wissengebiete
  integrieren und nachverfolgen

  Integration	Chance	Risiken, Stakeholder und Aufwand mit Kosten mehr
  integrieren	Überblick über alle Wissensgebiete wird gewährleistet	Monatliches
  Meetig mit dem Kernteam für diese Themen durchführen

  Integration	Risiko	Fokus bleibt nur auf Inhalt und Fortschritt	Der Blick für
  das gesamte Projektvorhaben geht verloren	Unbedingt den Statusbericht an den
  Auftraggeber gegen den Projektauftrag spiegeln

  Inhalt & Umfang	Stärke	Sehr gute fachliche Expertise im Projektteam	Die
  Entwicklung der App entspricht den Anforderungen der Anwender	Einbeziehung der
  späteren Anwender von Anfang an, um deren Anforderungen besser umzusetzen

  Inhalt & Umfang	Schwäche	Die gesetzlichen Anforderungen wurden nicht genug
  beachtet	Bedarf des Datenschutzes der "Abwesenheit bei Krankheit" wurde nicht
  erkannt	Anforderungen und Rahmenbedingungen mit allen Stakeholdern (Anwender,
  Datenschutz, Betriebsrat, Gesetzgebung) intensiv abstimmen

  Qualität	Stärke	Die Erfolgskriterien der Projektziele zu den Abnahmenkriterien
  zu machen war eine sehr gute Entscheidung	Die späteren Anwender waren von
  Anfang an eingebunden und haben das Projektteam sehr gut
  unterstützt	Erfolgskriterien zu Abnahmekriterien zu machen hilft bei der
  Qualitätssicheung sehr

  Qualität	Risiko	Ohne Erfolgskriterien werden die Qualitätsanforderungen nicht
  transparent	Ohne Abnahmekriterien kann man schnell an den Anforderungen der
  Anwender vorbei entwickeln	Einbezieheung der späteren Anwender schon bei der
  Erstellung des Projektauftrages

  Kosten	Stärke	Sehr gute Aufwandsplanung und hohe Transparenz im
  Berichtswesen	Auftraggeber sehen, dass wir die Kosten im Griff haben und haben
  bei den Nachforderungen sofort zugestimmt	Hohe Trasparenz bringt Vertrauen und
  stärkt die Zusammenarbeit

  Kosten	Schwäche	Die Risikokosten wurden im Projektauftrag nicht
  betrachtet	Durch das fehlende Budget gab es keinen Handlungsspielraum für die
  Umsetzung von Maßnahmen zur Risikominimierung	Im Projektauftrag immer das
  Risikobudget verankern

  Kommunikation	Chance	Regelmäßige Kommunikation mit den Stakeholdern
  (Auftraggeber, Fachbereiche etc.) fördert die Zusammenarbeit	Wir hatten sehr
  gute Unterstützung durch die Auftraggeber und die späteren Anwender	Duch die
  hohe Transparenz von Fortschritt, aber auch Problemen steigt die Unterstützung
  von "außen"

  Risiko	Chance	Risikomanagement von Anfang an	Risiken werden früh
  erkannt	Auftraggeber mit einbinden

  Risiko	Chance	Verbindlichkeit bei den Ressourcen schaffen	Planungssicherheit
  für das Projektteam	Plan-Ist-Forecast regelmäßig kommunizieren

  Termine	Stärke	Meeting- und Berichtskaskade, von Anfang an geplant, hat sehr
  gut funktioniert 	Jeder Projektbeteiligte und Stakeholder wusste, wann er was
  an Informationen erwarten konnte	Meeting- und Berichtskaskade sollte schon im
  Projektauftrag verankert werden

  Organisation	Stärke	Crossfunktionales Team wurde zusammengestellt	Hoche
  fachliche Abdeckung war damit gewährleistet	Rollen und Verantwortung sollten
  von Anfang an geklärt sein

  Organisation	Schwäche	Knowledge Monopol (Schnittstellenexperte)	Ausfall wurde
  schlecht kompensiert	Zusammenspiel mit dem Risikomanagement sicherstellen

  Organisation	Stärke	Sehr gute Zusammenarbeit mit Auftraggeber	Zeitnahe
  Unterstützung bei Problemen	Auftraggeber von Anfang an einbeziehen und seine
  Mitverantwortung "sichtbar machen"

  Organisation	Schwäche	Fehlendes Projektmanagement Know how	Lücken im
  Risikomanagement und Stakeholdermanagement	Aus- und Weiterbildungbildung im
  Projektmanagement in der Organisation anbieten

  Beschaffung	Stärke	Zusammenarbeit mit dem Einkauf war sehr gut	Kurzfristige
  Beschaffung einer wichtigen Ressource ging sehr schnell	Einkauf als
  Stakeholder frühzeitig mit einbinden

  Stakeholder	Chance	Stakeholderanalyse von Anfang an eingebunden	Positiver
  Einfluss der Stakeholder konnte genutzt werden	Stakeholder regelmäßig
  identifizieren, bewerten und einbinden

  Stakeholder	Risiko	Stakeholderanalyse nicht sehen oder ignorieren	Betriebsrat
  und DSGVO wurde "vergessen"	Stakeholder haben mehr Einfluss auf das Projekt
  als man denkt
_summary: >+
  Projekt- und Projektmanagementergebnisse

  Time: App wurde nicht im Zeitrahmen umgesetzt. Die Fertigstellung der App hat
  sich um 14 Tage verzögert

  Scope: Roll Out wurde verspätet freigegeben, da die DSGVO-Vorgaben nicht
  vollständig umgesetzt wurden. (Abwesenheit bei Krankheit war offen sichtbar)
  Betriebsrat hat die Freigabe nicht erteilt.

  Quality: Qualitätsanforderungen (EK) wurden erfüllt.

  Budget: Aufwand und Kosten mussten im Projektverlauf erhöht werden, da die
  Key-Ressource für den Datenschutz abgezogen wurde und durch externe
  Dienstleister zugekauft werden musste.

  Beschaffung: Zusammenarbeit mit dem Einkauf hat sehr gut (insbesondere bei der
  Nachbesetzung der Key Ressource) funktioniert.

  Stakeholder: SH wurden nur unzureichend betrachtet. Betriebsrat und
  Datenschutzbeauftragte wurden nicht einbezogen.

  Risk: Risiken wurden nur unzureichend betrachtet. Der Abzug einer
  Key-Ressource hat Mehrkosten verursacht.

  Organisation: Die Projektorganisation (AG, LK, PL, KT, PT) war sehr gut
  aufgestellt und hat funktioniert.

  Kommunikation: Die Kommunikation innerhalb des Projektes war sehr gut. Die
  Einbeziehung der Stakeholder hat nicht stattgefunden. Die Statusberichte PL
  (14-tägig) und AG (aller 6 Wochen) wurden durchgeführt und dokumentiert.

  Integration: Die Zusammenführung der Ergebnisse aus den Wissensgebieten hat
  sehr gut funktioniert. Der Projektfortschritt und die Prognose waren
  transparent und nachvollziehbar.

