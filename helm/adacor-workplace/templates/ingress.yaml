{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "adacor-workplace.fullname" . }}
  labels:
    {{- include "adacor-workplace.labels" . | nindent 4 }}
  annotations:
    # SSE/Streaming support (critical for chat)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.maxBodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/connection-proxy-header: ""
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "adacor-workplace.backend.fullname" . }}
                port:
                  number: 3001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "adacor-workplace.backend.fullname" . }}
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "adacor-workplace.frontend.fullname" . }}
                port:
                  number: 80
{{- end }}
