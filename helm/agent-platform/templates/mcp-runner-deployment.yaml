{{- if .Values.mcpRunner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-platform.mcpRunner.fullname" . }}
  labels:
    {{- include "agent-platform.mcpRunner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpRunner.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-platform.mcpRunner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "agent-platform.mcpRunner.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-runner
          image: {{ include "agent-platform.mcpRunner.image" . }}
          imagePullPolicy: {{ .Values.mcpRunner.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: MCP_RUNNER_PORT
              value: "3002"
            - name: MCP_RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-platform.secretName" . }}
                  key: MCP_RUNNER_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.mcpRunner.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.mcpRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
